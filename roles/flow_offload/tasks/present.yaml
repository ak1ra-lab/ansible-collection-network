---
# tasks/present.yaml - apply the flow offload table (flow_offload_state:
# present) while flow_offload_enabled is the master switch: the disabled path
# only removes a drop-in left behind by a previous run.

- name: ensure nftables package is installed
  when: flow_offload_enabled | ansible.builtin.bool
  ansible.builtin.package:
    name: nftables
    state: present

- name: ensure /etc/nftables.d directory exists
  when: flow_offload_enabled | ansible.builtin.bool
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: template flow offload nft rules on remote
  when: flow_offload_enabled | ansible.builtin.bool
  ansible.builtin.template:
    src: etc/nftables.d/ansible_flow_offload.nft.j2
    dest: /etc/nftables.d/ansible_flow_offload.nft
    mode: "0644"
  notify:
    - systemctl restart nftables.service

- name: remove flow offload nft ruleset file when the master switch is off
  when: not (flow_offload_enabled | ansible.builtin.bool)
  ansible.builtin.file:
    path: /etc/nftables.d/ansible_flow_offload.nft
    state: absent
  notify:
    - systemctl restart nftables.service

- name: ensure nftables.service enabled
  when: flow_offload_enabled | ansible.builtin.bool
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
