---
# tasks/reset.yaml - remove the table file this role created
# (flow_offload_state: absent).  The nftables package and any base config are
# left untouched (shared with other roles / the host).

- name: remove flow offload nft ruleset file
  ansible.builtin.file:
    path: /etc/nftables.d/ansible_flow_offload.nft
    state: absent
  notify:
    - systemctl restart nftables.service
