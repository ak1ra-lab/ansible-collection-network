---
# tasks file for ak1ra_lab.network.flow_offload
# Dispatcher: branch on flow_offload_state.

- name: validate flow_offload_state
  ansible.builtin.assert:
    that:
      - flow_offload_state in flow_offload_state_available
    fail_msg: |
      flow_offload_state must be one of: {{ flow_offload_state_available }}
      (got: {{ flow_offload_state }})
    quiet: true

- name: "remove managed artifacts (flow_offload_state: absent)"
  when: flow_offload_state == 'absent'
  ansible.builtin.import_tasks: reset.yaml

- name: "apply flow offload table (flow_offload_state: present)"
  when: flow_offload_state == 'present'
  ansible.builtin.import_tasks: present.yaml
