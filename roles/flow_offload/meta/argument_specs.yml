---
argument_specs:
  main:
    short_description: nftables flowtable offloading for forwarded traffic
    description:
      - Deploy an independent opt-in nftables flowtable that offloads forwarded traffic on the selected interfaces.
    options:
      flow_offload_state:
        description: 'Declarative state: present applies the flow offload table; absent removes the table file this role created.'
        type: str
        choices:
          - present
          - absent
        default: present
        required: false
      flow_offload_enabled:
        description: Master switch. When disabled the role removes the drop-in it created and otherwise touches nothing.
        type: bool
        default: false
        required: false
      flow_offload_interfaces:
        description: Interfaces bound to the flowtable. Defaults to auto-detection of common exit and bridge interfaces
          (eth*, enp*, ens*, enx*, br*); override to pin an explicit list. The default is empty when facts are not
          gathered, so the absent state works with gather_facts false.
        type: list
        elements: str
        default: |-
          {{ ansible_facts.interfaces | default([])
             | select('ansible.builtin.match', '^(eth|en[psx]|br)')
             | sort | unique | list }}
        required: false
