---
# defaults file for ak1ra_lab.network.flow_offload

# Declarative state:
#   present - apply the flow offload table
#   absent  - remove the table file this role created (tasks/reset.yml)
flow_offload_state: present
flow_offload_state_available: [present, absent]

# Master switch - disabled by default (opt-in role).  With the switch off,
# tasks/present.yml only removes a drop-in left behind by a previous run.
flow_offload_enabled: false

# Interfaces bound to the flowtable.  Defaults to auto-detection of common
# exit/bridge interfaces (eth*, enp*, ens*, enx*, br*); override to pin.
# Without gathered facts the default is empty so the absent state still works
# on hosts running with gather_facts: false.
flow_offload_interfaces: >-
  {{
    ansible_facts.interfaces | default([])
    | select('ansible.builtin.match', '^(eth|en[psx]|br)')
    | sort | unique | list
  }}
