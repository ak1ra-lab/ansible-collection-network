---
# tasks/present.yaml - apply the bridge configuration
# (systemd_bridge_state: present)
#
# Sequencing matters: on hosts with NetworkManager the enslaved interface must
# be declared unmanaged BEFORE systemd-networkd (re)applies the bridge config,
# or the two stacks fight over the interface.
#
# File naming (numeric prefixes encode the load order systemd-networkd needs):
#   10-<name>.network[dev]  the bridge .netdev definition itself
#   15-<interface>.network  enslaves the dedicated physical interface
#   20-<name>.network       configures the bridge link (always rendered; with
#                           `address`/`gateway`/`dns` when declared)

- name: ensure iproute2 is installed (bridge teardown fallback)
  ansible.builtin.package:
    name:
      - iproute2
    state: present

- name: gather service facts (NetworkManager coexistence)
  when: systemd_bridge_bridges | length > 0
  ansible.builtin.service_facts:

- name: ensure systemd-networkd is enabled and running (bridge persistence)
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true
    state: started

- name: ensure systemd-networkd configuration directory exists
  ansible.builtin.file:
    path: "{{ _systemd_bridge_network_dir }}"
    state: directory
    mode: "0755"

- name: ensure NetworkManager conf.d directory exists (when NetworkManager is present)
  when: >-
    systemd_bridge_bridges | length > 0
    and ansible_facts['services'] is defined
    and 'NetworkManager.service' in ansible_facts['services']
  ansible.builtin.file:
    path: "{{ _systemd_bridge_nm_conf_dir }}"
    state: directory
    mode: "0755"

- name: template NetworkManager unmanaged-devices drop-ins on remote
  when: >-
    systemd_bridge_bridges | length > 0
    and ansible_facts['services'] is defined
    and 'NetworkManager.service' in ansible_facts['services']
  ansible.builtin.template:
    src: etc/NetworkManager/conf.d/ansible-bridge.conf.j2
    dest: "{{ _systemd_bridge_nm_conf_dir }}/10-{{ bridge.name }}.conf"
    mode: "0644"
  loop: "{{ systemd_bridge_bridges }}"
  loop_control:
    loop_var: bridge
    label: "{{ bridge.interface }}"
  notify:
    - reload NetworkManager

- name: template bridge netdev files on remote
  ansible.builtin.template:
    src: etc/systemd/network/ansible-bridge.netdev.j2
    dest: "{{ _systemd_bridge_network_dir }}/10-{{ bridge.name }}.netdev"
    mode: "0644"
  loop: "{{ systemd_bridge_bridges }}"
  loop_control:
    loop_var: bridge
    label: "{{ bridge.name }}"
  notify:
    - restart systemd-networkd.service

- name: template physical interface enslave files on remote
  ansible.builtin.template:
    src: etc/systemd/network/ansible-bridge-enslave.network.j2
    dest: "{{ _systemd_bridge_network_dir }}/15-{{ bridge.interface }}.network"
    mode: "0644"
  loop: "{{ systemd_bridge_bridges }}"
  loop_control:
    loop_var: bridge
    label: "{{ bridge.interface }}"
  notify:
    - restart systemd-networkd.service

- name: template bridge configuration files on remote
  ansible.builtin.template:
    src: etc/systemd/network/ansible-bridge.network.j2
    dest: "{{ _systemd_bridge_network_dir }}/20-{{ bridge.name }}.network"
    mode: "0644"
  loop: "{{ systemd_bridge_bridges }}"
  loop_control:
    loop_var: bridge
    label: "{{ bridge.address | ansible.builtin.default('<no address>') }}"
  notify:
    - restart systemd-networkd.service

- name: scan networkd configuration for other files matching the managed devices
  when: systemd_bridge_bridges | length > 0
  vars:
    _managed_names: >-
      {{ (systemd_bridge_bridges | map(attribute='name')
          + systemd_bridge_bridges | map(attribute='interface'))
         | ansible.builtin.list | ansible.builtin.unique
         | ansible.builtin.map('ansible.builtin.regex_escape') | ansible.builtin.join('|') }}
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -rlsE
      - "^Name=([^!]*[*|][^!]*|{{ _managed_names }})$"
      - /etc/systemd/network
      - /run/systemd/network
      - /usr/lib/systemd/network
  changed_when: false
  failed_when: false
  register: _systemd_bridge_conflict_files

- name: exclude this role's own networkd files (embedded marker comment)
  when: _systemd_bridge_conflict_files.stdout_lines | length > 0
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/grep', '-LsF', _systemd_bridge_file_marker]
         + _systemd_bridge_conflict_files.stdout_lines }}
  changed_when: false
  failed_when: false
  register: _systemd_bridge_conflict_files_other

- name: fail on conflicting networkd configuration (systemd_bridge_conflict_check)
  when: >-
    systemd_bridge_bridges | length > 0
    and _systemd_bridge_conflict_files.stdout_lines | length > 0
    and systemd_bridge_conflict_check | ansible.builtin.bool
    and _systemd_bridge_conflict_files_other.stdout_lines | length > 0
  ansible.builtin.assert:
    that: false
    fail_msg: >-
      other systemd-networkd configuration already matches an interface or
      bridge this role is about to manage:
      {{ _systemd_bridge_conflict_files_other.stdout_lines }}.  A device is
      configured by a single .network file; make sure netplan / ifupdown /
      manual configs do not also claim the dedicated interfaces (remove or
      rename the conflicting files, or set systemd_bridge_conflict_check:
      false to only warn).
    quiet: false

- name: warn about conflicting networkd configuration (check disabled)
  when: >-
    systemd_bridge_bridges | length > 0
    and _systemd_bridge_conflict_files.stdout_lines | length > 0
    and not (systemd_bridge_conflict_check | ansible.builtin.bool)
    and _systemd_bridge_conflict_files_other.stdout_lines | length > 0
  ansible.builtin.debug:
    msg: >-
      other systemd-networkd configuration matches an interface or bridge
      this role manages: {{ _systemd_bridge_conflict_files_other.stdout_lines }}.
      A device is configured by a single .network file - verify these files
      do not claim the dedicated interfaces.

- name: apply the bridge configuration now
  ansible.builtin.meta: flush_handlers
