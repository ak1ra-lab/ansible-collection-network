---
# ak1ra_lab.network.mihomo_client - public variable contract
#
# Deploys the mihomo TUN transparent-gateway profile based on the
# `mihomo-setup` deployment: the TUN inbound (auto-route + auto-redirect +
# auto-detect-interface + dns-hijack) captures both local and LAN-forwarded
# traffic, so no nftables/TPROXY plumbing and no `ak1ra_lab.network.tproxy`
# dependency is involved.  LAN clients only need this host as their
# gateway/DNS (`mihomo_client_mode: gateway` sets `net.ipv4.ip_forward=1` and
# relaxes rp_filter).
#
# The profile is a pair of hand-maintained templates rendered with
# `mihomo_client_config_template`: the proxy-group topology, rule providers,
# rules and the DNS split live in those files as plain mihomo YAML, and only
# the variables below are rendered into them.  The default plain template
# (config.yaml.j2) has two tiers and merges self-hosted nodes into the normal
# region groups; the selfhost-tier template (config.selfhost.yaml.j2) keeps
# a separate *-自建 tier for chain-proxy deployments.  To customize beyond
# these knobs, copy the template, edit the copy and point the variable at it.
#
# The role owns the service identity, the profile, the systemd unit and the
# service, but not the binary: playbooks/mihomo_client.yaml applies
# ak1ra_lab.network.mihomo_install (the mihomo_install_* contract) first; the
# role only asserts that the binary exists.

# ── Lifecycle ────────────────────────────────────────────────────────────────

mihomo_client_state: present

# `gateway` deploys the LAN-gateway sysctl drop-in (ip_forward/rp_filter);
# `local` is the host-only shape (e.g. a laptop) and removes it again.
mihomo_client_mode: gateway

# ── Profile template ─────────────────────────────────────────────────────────

# Keep self-hosted nodes in a separate *-自建 tier instead of merging them
# into the normal selector / url-test groups.  Required for chain-proxy
# deployments: with a separate tier the original (direct) node and a chained
# variant can coexist without leaking the chained nodes into the normal
# region groups.  The self-hosted tier only covers US/SG/JP; self-hosted
# nodes in other regions stay in the 🚀 所有节点 - 自建 catch-all.  false
# renders the plain profile (config.yaml.j2), true the selfhost-tier profile
# (config.selfhost.yaml.j2).
mihomo_client_selfhost_tier: false

# Template rendered to <mihomo_client_etc_dir>/config.yaml.  Relative paths
# resolve like any other template source (the role's templates/ directory and
# a templates/ directory next to the invoking playbook).  Defaults to the
# plain or selfhost-tier shipped template according to
# mihomo_client_selfhost_tier; point it at a copy to customize the profile.
mihomo_client_config_template: >-
  {{ 'etc/mihomo/config.selfhost.yaml.j2'
     if mihomo_client_selfhost_tier | ansible.builtin.bool
     else 'etc/mihomo/config.yaml.j2' }}

# ── Profile values ───────────────────────────────────────────────────────────

# Values rendered into the profile template.
mihomo_client_mixed_port: 7890

# Clash API secret.  Generated with the ak1ra_lab.network.random_password
# lookup (control-node CSPRNG) when empty and persisted to
# `mihomo_client_host_vars_file`, so repeated runs reuse the stored value; an
# explicit non-empty value always wins.  The controller listens on
# 0.0.0.0:9090, so keep a secret for anything beyond a trusted LAN.
mihomo_client_api_secret: ""

# Dashboard archive URL; when set, mihomo fetches it into the `external-ui`
# directory (`ui`) at startup, e.g.
# "https://github.com/MetaCubeX/Yacd-meta/archive/gh-pages.zip".
mihomo_client_external_ui_url: ""

# Debian/Ubuntu cloud images run systemd-resolved: its stub listener owns
# 127.0.0.53:53, so mihomo's dns.listen cannot bind :53 (mihomo logs
# "Start DNS server error" and keeps running) and /etc/resolv.conf (a
# symlink into /run) would bypass the mihomo DNS module.  When enabled (and
# the unit exists) the role stops/disables the service; teardown re-enables
# it and restores the distro stub symlink.
mihomo_client_dns_manage_resolved: true

# Take over /etc/resolv.conf itself (a symlink is removed rather than
# written through) and point it at the mihomo listener.  Kept independent
# from manage_resolved so an environment where the file is not writable
# (e.g. a bind mount) can still free :53.
mihomo_client_dns_manage_resolv_conf: true

# ── Providers ────────────────────────────────────────────────────────────────

# proxy providers subscriptions, keyed by provider name; the role derives
# `path: ./providers/<name>.yaml` for http providers without one.  Real
# subscription URLs are credentials - keep them in uncommitted group_vars.
# The reserved `selfhost` file provider is always injected by the role.
mihomo_client_proxy_providers: {}

# Self-hosted nodes for providers/selfhost.yaml: inline clash proxy mappings
# and/or controller-local artifact files generated by the mihomo_server role
# (config/client_outbounds/<host>.proxies.yaml).  File paths go through
# Ansible's file lookup, so relative entries resolve against the
# role/playbook directories (not the working directory) - anchor them with
# `{{ playbook_dir }}`-based or absolute paths.  Node names must carry the
# selfhost tag and a region token.  The plain profile merges them into the
# normal region groups; the selfhost-tier profile additionally uses the tag
# for its *-自建 groups.  For chain-proxy, enable
# mihomo_client_selfhost_tier and add `dialer-proxy` to the node mappings or
# artifacts.
mihomo_client_selfhost_proxies: []
mihomo_client_selfhost_files: []

# ── Custom rule sets (inline rule providers) ─────────────────────────────────

# Payload values for the pre-filled inline rule providers in the profile
# template; a set (and its rules) only renders when its list is non-empty.
# The internal set routes DIRECT and resolves through
# `mihomo_client_custom_internal_nameservers` (set both together); rejected
# sets force REJECT and proxied sets force PROXY before the geo rules;
# direct sets force DIRECT and their domains also resolve through the
# domestic DoH pair (mirroring the routing).
#
# The domain (`*_payload`) and IP (`*_ip_payload`) lists are deliberately
# separate: mihomo's rule-set `behavior` is the payload type, not a hint.
# A domain set takes clash wildcard domains (bare `ads.example` matches
# exactly, `.ads.example` the subdomains, `+.ads.example` both) and an
# ipcidr set takes CIDRs (`10.20.0.0/16`).  The template references the
# internal/direct domain sets from dns.nameserver-policy, which rejects an
# ipcidr rule-set at config load ("rule provider type error, expect
# domain") and accepts a classical set only with a warning that just its
# domain rules are matched - so keeping the lists apart keeps every set
# loadable where it is referenced and the payload syntax simple.

mihomo_client_custom_internal_nameservers: []
mihomo_client_custom_internal_rule_set_payload: []

mihomo_client_custom_rejected_rule_set_payload: []
mihomo_client_custom_rejected_rule_set_ip_payload: []
mihomo_client_custom_direct_rule_set_payload: []
mihomo_client_custom_direct_rule_set_ip_payload: []
mihomo_client_custom_proxied_rule_set_payload: []
mihomo_client_custom_proxied_rule_set_ip_payload: []

# ── Data files and downloads ─────────────────────────────────────────────────

# Data files the profile depends on, fetched from the MetaCubeX/meta-rules-dat
# GitHub release through ak1ra_lab.general.github_releases_info (the asset
# digest is the get_url checksum).  BundleMRS.7z is the extraction source of
# the .mrs rule sets (mihomo reads them through `path-in-bundle`); the rules
# use `RULE-SET`/rule-set references only, so no GeoIP/GeoSite data file is
# needed - the DNS split is rule-set based as well (see the DNS section).
# `mihomo_client_bundle_src` takes precedence with an explicit source: a
# controller-local file path (relative paths resolve like any copy/template
# source, against the role and playbook directories) or an `http(s)`/`ftp`
# URL; the value shape picks the transport.  `*_force` re-downloads on every
# run.  The release lookup authenticates with the controller's GITHUB_TOKEN
# environment variable when present (rate limits); there is no variable -
# export GITHUB_TOKEN for the playbook run.
mihomo_client_data_repo: MetaCubeX/meta-rules-dat
mihomo_client_bundle_src: ""
mihomo_client_bundle_asset: BundleMRS.7z
mihomo_client_bundle_force: false

# ── Service identity and paths ───────────────────────────────────────────────

# The `mihomo` service identity and the /etc/mihomo + binary paths are
# role-owned conventions and live in vars/main.yaml (override them with role
# params or `-e` if they really must differ); the binary is deployed by
# ak1ra_lab.network.mihomo_install and only asserted here.

# Optional controller-local mirror of the rendered profile: when set (a
# directory path), the role also writes
# <dir>/<inventory_hostname>.config.yaml on the controller for backup/diff
# purposes.  Empty disables the local render.
mihomo_client_local_artifacts_dir: ""

# Controller-local credentials file (mode 0600): the Clash API secret
# (generated or explicitly set) is written here, keeping credentials out of
# the repository.  As with mihomo_server, a file next to the playbook in
# host_vars/ is auto-loaded by Ansible on later runs (the default), so the
# stored secret wins; a file outside the auto-load locations is rewritten -
# and the secret regenerated when it was not provided - on every run.
mihomo_client_host_vars_file: >-
  {{ playbook_dir }}/host_vars/{{ inventory_hostname }}/mihomo_client.yaml

# ── LAN-gateway sysctl (mihomo_client_mode: gateway) ─────────────────────────

# ip_forward is required to forward LAN traffic; rp_filter=0 avoids dropping
# packets on the asymmetric proxy path (the booleans map to the sysctl
# values 1/0).  Neither key is touched in `local` mode (and the drop-in is
# removed).
mihomo_client_sysctl_ip_forward: true
mihomo_client_sysctl_rp_filter: false
