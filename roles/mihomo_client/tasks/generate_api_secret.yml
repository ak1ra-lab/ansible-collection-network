---
# tasks/generate_api_secret.yml - generate the Clash API secret only when the
# role received an empty value, then persist the generated value to the
# controller-local host_vars file:
#   - a non-empty `mihomo_client_api_secret` is treated as supplied, whether
#     it came from host_vars, group_vars, a play var or -e; it wins and is not
#     copied into another file;
#   - only a generated value is written to mihomo_client_host_vars_file, mode
#     0600.  When that file lives in the playbook-adjacent host_vars location
#     (the default) Ansible auto-loads it on later runs, so the stored secret
#     wins over generation;
#   - generation uses the ak1ra_lab.general.random_password lookup (the
#     control node's CSPRNG), same as the mihomo_server credentials.
# The artifact writes run on the controller (delegate_to localhost, no
# privilege escalation).

- name: determine whether the Clash API secret must be generated
  ansible.builtin.set_fact:
    _mihomo_client_generate_api_secret: "{{ mihomo_client_api_secret | length == 0 }}"

- name: generate the Clash API secret
  when: _mihomo_client_generate_api_secret | ansible.builtin.bool
  no_log: true
  ansible.builtin.set_fact:
    mihomo_client_api_secret: >-
      {{ lookup('ak1ra_lab.general.random_password') }}

- name: ensure the host_vars directory exists
  when: _mihomo_client_generate_api_secret | ansible.builtin.bool
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ mihomo_client_host_vars_file | ansible.builtin.dirname }}"
    state: directory
    mode: "0755"

- name: save the generated Clash API secret to host_vars
  when: _mihomo_client_generate_api_secret | ansible.builtin.bool
  delegate_to: localhost
  become: false
  no_log: true
  ansible.builtin.template:
    src: host_vars.yml.j2
    dest: "{{ mihomo_client_host_vars_file }}"
    mode: "0600"
