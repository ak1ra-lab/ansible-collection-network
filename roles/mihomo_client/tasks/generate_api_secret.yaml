---
# tasks/generate_api_secret.yaml - generate the Clash API secret when it was
# not provided, then persist it to the controller-local host_vars file:
#   - the generated value (and an explicit non-empty input) is written to
#     mihomo_client_host_vars_file, mode 0600.  When that file lives in the
#     playbook-adjacent host_vars location (the default) Ansible auto-loads
#     it on later runs, so the stored secret wins over generation;
#   - generation uses the ak1ra_lab.network.random_password lookup (the
#     control node's CSPRNG), same as the mihomo_server credentials.  An
#     explicitly set `mihomo_client_api_secret` is never touched.
# The artifact writes run on the controller (delegate_to localhost, no
# privilege escalation).

- name: generate the Clash API secret
  when: mihomo_client_api_secret | length == 0
  no_log: true
  ansible.builtin.set_fact:
    mihomo_client_api_secret: >-
      {{ lookup('ak1ra_lab.network.random_password') }}

- name: ensure the host_vars directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ mihomo_client_host_vars_file | ansible.builtin.dirname }}"
    state: directory
    mode: "0755"

- name: save the Clash API secret to host_vars
  delegate_to: localhost
  become: false
  no_log: true
  ansible.builtin.template:
    src: host_vars.yaml.j2
    dest: "{{ mihomo_client_host_vars_file }}"
    mode: "0600"
