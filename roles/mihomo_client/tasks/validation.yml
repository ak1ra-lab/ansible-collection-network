---
# tasks/validation.yml - fail fast on contract violations before anything
# on the host is touched.  The profile template renders its own content; this
# file checks the role-level shape (and the payload lists, because a string
# would silently render as a character list through `| list`).
#
# Checks are grouped by concern (state, mode, profile, identity, node
# sources, rule sets) so the failing task name and message identify the
# variable family that violates the contract.

- name: validate mihomo_client_state
  ansible.builtin.assert:
    that:
      - mihomo_client_state in mihomo_client_state_available
    fail_msg: >-
      mihomo_client_state must be one of {{ mihomo_client_state_available }}
      (got: {{ mihomo_client_state }})
    quiet: true

- name: validate mihomo_client_mode
  ansible.builtin.assert:
    that:
      - mihomo_client_mode in mihomo_client_mode_available
    fail_msg: >-
      mihomo_client_mode must be one of {{ mihomo_client_mode_available }}
      (got: {{ mihomo_client_mode }})
    quiet: true

- name: validate the mihomo_client profile settings
  ansible.builtin.assert:
    that:
      - mihomo_client_etc_dir is ansible.builtin.match('^/')
      - mihomo_client_config_template | length > 0
      - mihomo_client_mixed_port | int > 0
      - mihomo_client_mixed_port | int < 65536
    fail_msg: |
      mihomo_client profile settings are invalid:
        mihomo_client_etc_dir must be an absolute path
        (got: {{ mihomo_client_etc_dir }})
        mihomo_client_config_template must be a non-empty template path
        mihomo_client_mixed_port must be within 1..65535
        (got: {{ mihomo_client_mixed_port }})
    quiet: true

- name: validate the mihomo_client service identity
  ansible.builtin.assert:
    that:
      - mihomo_client_user | length > 0
      - mihomo_client_group | length > 0
    fail_msg: >-
      mihomo_client_user and mihomo_client_group must not be empty
      (got: {{ mihomo_client_user }}:{{ mihomo_client_group }})
    quiet: true

- name: validate the mihomo_client node source types
  ansible.builtin.assert:
    that:
      - mihomo_client_proxy_providers | ansible.builtin.type_debug == 'dict'
      - mihomo_client_selfhost_proxies | ansible.builtin.type_debug == 'list'
      - mihomo_client_selfhost_files | ansible.builtin.type_debug == 'list'
    fail_msg: |
      mihomo_client node sources have invalid types:
        mihomo_client_proxy_providers must be a mapping
        (got: {{ mihomo_client_proxy_providers | ansible.builtin.type_debug }})
        mihomo_client_selfhost_proxies must be a list
        (got: {{ mihomo_client_selfhost_proxies | ansible.builtin.type_debug }})
        mihomo_client_selfhost_files must be a list
        (got: {{ mihomo_client_selfhost_files | ansible.builtin.type_debug }})
    quiet: true

- name: validate the mihomo_client custom rule set types
  ansible.builtin.assert:
    that:
      - mihomo_client_custom_internal_nameservers | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_internal_rule_set_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_rejected_rule_set_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_rejected_rule_set_ip_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_direct_rule_set_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_direct_rule_set_ip_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_proxied_rule_set_payload | ansible.builtin.type_debug == 'list'
      - mihomo_client_custom_proxied_rule_set_ip_payload | ansible.builtin.type_debug == 'list'
    fail_msg: >-
      mihomo_client_custom_internal_nameservers and every
      mihomo_client_custom_*_payload must be lists
    quiet: true

- name: validate the mihomo_client internal rule set nameservers
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_client_custom_internal_rule_set_payload | length == 0)
        or (mihomo_client_custom_internal_nameservers | length > 0)
    fail_msg: >-
      a non-empty mihomo_client_custom_internal_rule_set_payload requires
      mihomo_client_custom_internal_nameservers; otherwise its domains route
      DIRECT but resolve through the foreign DoH pair
    quiet: true

- name: "validate the mihomo_client node sources (mihomo_client_state: present)"
  when: mihomo_client_state == 'present'
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_client_proxy_providers | length > 0)
        or (mihomo_client_selfhost_proxies | length > 0)
        or (mihomo_client_selfhost_files | length > 0)
    fail_msg: >-
      at least one node source is required when state=present:
      mihomo_client_proxy_providers, mihomo_client_selfhost_proxies or
      mihomo_client_selfhost_files
    quiet: true
