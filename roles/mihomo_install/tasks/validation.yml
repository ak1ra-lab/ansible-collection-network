---
# tasks/validation.yml - fail fast on contract violations before anything
# on the host is touched.
#
# Checks are grouped by concern (version, microarchitecture, path, release
# asset) so the failing task name and message identify the variable family
# that violates the contract.

- name: validate mihomo_install_version
  ansible.builtin.assert:
    that:
      - >-
        mihomo_install_version in mihomo_install_version_available
        or mihomo_install_version is ansible.builtin.regex('^v?\d+(\.\d+)+$')
    fail_msg: >-
      mihomo_install_version must be 'present', 'latest' or a version such as
      '1.19.32' / 'v1.19.32' (got: {{ mihomo_install_version }})
    quiet: true

- name: validate mihomo_install_microarch
  ansible.builtin.assert:
    that:
      - >-
        (not mihomo_install_microarch)
        or mihomo_install_microarch in ['auto', 'none', 'baseline']
        or mihomo_install_microarch is ansible.builtin.regex('^v?[1-4]$|^x86-64-v[1-4]$')
    fail_msg: >-
      mihomo_install_microarch must be empty, 'auto', 'none'/'baseline' or a
      level such as 'v3' / 'x86-64-v3'
      (got: {{ mihomo_install_microarch }})
    quiet: true

- name: validate mihomo_install_binary
  ansible.builtin.assert:
    that:
      - mihomo_install_binary is ansible.builtin.match('^/')
    fail_msg: >-
      mihomo_install_binary must be an absolute path
      (got: {{ mihomo_install_binary }})
    quiet: true

- name: "validate the mihomo_install release asset (mihomo_install_enabled: true)"
  when: mihomo_install_enabled | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_install_package_src | length > 0)
        or (_mihomo_install_asset_arch | length > 0)
    fail_msg: |
      a supported architecture (x86_64/aarch64/...) is required unless
      mihomo_install_package_src overrides the release lookup
        detected architecture: {{ ansible_facts.architecture | default('unknown') }}
        package_src:           {{ mihomo_install_package_src | default('') }}
    quiet: true

- name: "validate the mihomo_install microarchitecture (mihomo_install_enabled: true)"
  when: mihomo_install_enabled | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - >-
        (not mihomo_install_microarch)
        or mihomo_install_microarch in ['auto', 'none', 'baseline']
        or (_mihomo_install_asset_arch == 'amd64')
    fail_msg: >-
      mihomo_install_microarch levels apply to amd64 only; use 'none' or
      'baseline' on this architecture (got:
      {{ mihomo_install_microarch }} on
      {{ _mihomo_install_asset_arch | default('an unsupported architecture', true) }})
    quiet: true
