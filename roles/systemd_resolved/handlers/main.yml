---
# handlers file for ak1ra_lab.network.systemd_resolved
- name: systemd_resolved restart
  ansible.builtin.systemd_service:
    name: "{{ _systemd_resolved_service }}"
    state: restarted

- name: systemd_resolved flush-caches
  ansible.builtin.command:
    argv:
      - resolvectl
      - flush-caches
  changed_when: false
  failed_when: false
