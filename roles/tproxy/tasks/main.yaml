---
# tasks file for ak1ra_lab.network.tproxy

- name: validate contract variables
  ansible.builtin.import_tasks: validation.yaml

- name: ensure packages is installed
  ansible.builtin.package:
    name:
      - bash
      - curl
      - iproute2
      - nftables
    state: present

- name: enable tcp_bbr
  when:
    - ansible_facts['kernel'] is version('4.9.0', '>=')
    - (tproxy_tcp_bbr_enabled | ansible.builtin.bool)
  ansible.builtin.import_tasks: tcp_bbr.yaml

- name: ensure ip_forward state
  ansible.builtin.import_tasks: ip_forward.yaml

- name: set Netfilter conntrack sysfs variables
  ansible.builtin.import_tasks: nf_conntrack.yaml

- name: create drop-in directory
  ansible.builtin.file:
    path: "{{ directory }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/iproute2/rt_tables.d
  loop_control:
    loop_var: directory

# 先创建路由表
- name: template iproute2 rt_tables on remote
  ansible.builtin.template:
    src: etc/iproute2/rt_tables.d/ansible_tproxy.conf.j2
    dest: /etc/iproute2/rt_tables.d/ansible_tproxy.conf
    mode: "0644"

# 添加 ip rule (policy routing) 和 ip route (local default)
- name: template ansible-tproxy-routing.service on remote
  when: (_tproxy_enable_routing | ansible.builtin.bool)
  ansible.builtin.template:
    src: etc/systemd/system/ansible-tproxy-routing.service.j2
    dest: /etc/systemd/system/ansible-tproxy-routing.service
    mode: "0644"
  notify:
    - systemctl daemon-reload
    - restart ansible-tproxy-routing.service

- name: enable and start ansible-tproxy-routing.service
  when: (_tproxy_enable_routing | ansible.builtin.bool)
  ansible.builtin.systemd_service:
    name: ansible-tproxy-routing.service
    enabled: true
    state: started
    daemon_reload: true

- name: template static /etc/resolv.conf
  when: (tproxy_etc_resolv_conf | ansible.builtin.bool)
  ansible.builtin.template:
    src: etc/resolv.conf.j2
    dest: /etc/resolv.conf
    mode: "0644"

# nftables 才是一切的关键, 为 packet 打 fwmark
- name: ensure /etc/nftables.conf
  ansible.builtin.import_tasks: nftables.yaml
