---
# ak1ra_lab.network.tproxy - public variable contract
#
# Engine-agnostic TPROXY transparent proxy plumbing: nftables marking, policy
# routing, sysctl.  Any proxy engine listening on a TPROXY inbound plugs in
# through these variables (see README.md for the contract table).

# Deployment shape:
#   gateway - proxy forwarded (LAN) and local traffic; enables ip_forward
#   local   - proxy local traffic only
tproxy_mode: gateway
tproxy_mode_available: [local, gateway]

# Port the proxy engine listens on with its TPROXY inbound.
# DNS transparent interception (chain-first prerouting rule) delivers packets
# to this port as well; the engine consumes them through its own mechanism
# (e.g. the sing-box route action hijack-dns).
tproxy_listen_port: 7895

# UID/GID of the proxy engine's runtime user.  Packets generated by this
# identity are marked with tproxy_bypass_mark so the engine's own upstream
# traffic bypasses interception (loop prevention).
tproxy_uid: 13
tproxy_gid: 13

# iproute2 / nftables marks and route table
tproxy_route_table: 224
tproxy_fwmark: 224
tproxy_bypass_mark: 225

# Exit interfaces.  Defaults auto-detect from facts; override to pin.
tproxy_interface: "{{ ansible_facts['default_ipv4'].interface }}"
tproxy_interface6: "{{ ansible_facts['default_ipv6'].interface }}"

# IPv6 support.  Defaults to auto-detection of a default IPv6 interface;
# override to force on/off.
tproxy_enable_ipv6: >-
  {{ ansible_facts['default_ipv6'] is defined
     and ansible_facts['default_ipv6'].interface is defined }}

# Kernel-level bypass / reject CIDRs applied directly in nftables.
# Domain-level policy belongs to the proxy engine's profile; these lists only
# decide what never enters the transparent proxy path at all (IP layer).
tproxy_bypass_cidr4: []
tproxy_bypass_cidr6: []
tproxy_reject_cidr4: []
tproxy_reject_cidr6: []

# TCP BBR congestion control (sysctl).  TEMPORARILY shipped in this role; its
# final home is undecided - do not build on this variable.
tproxy_tcp_bbr_enabled: true

# nf_conntrack sysctl tunables (serves the TPROXY interception path)
tproxy_sysctl_nf_conntrack: true
tproxy_sysctl_nf_conntrack_buckets: 65536
tproxy_sysctl_nf_conntrack_max: 262144
tproxy_sysctl_nf_conntrack_tcp_timeout_established: 3600

# Optional static /etc/resolv.conf.
# All DNS is transparently intercepted by nftables and delivered to the proxy
# engine, so the content of this file is never used for actual resolution; it
# only exists so that clients see a valid resolver configuration.
tproxy_etc_resolv_conf: true
tproxy_etc_resolv_conf_servers:
  - 1.1.1.1
  - 1.0.0.1

# Internal: feature flags derived from tproxy_mode (do not modify manually)
_tproxy_enable_ip_forward: "{{ tproxy_mode == 'gateway' }}"
_tproxy_enable_routing: "{{ tproxy_mode in ['local', 'gateway'] }}"
