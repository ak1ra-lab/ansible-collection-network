---
# tasks/generate_credentials.yaml - generate the credentials that were not
# provided, then write the local artifacts:
#   - host_vars credentials (mode 0600) in the playbook-adjacent location,
#     which Ansible auto-loads on later runs (the default
#     `mihomo_server_host_vars_file` resolves to
#     playbooks/host_vars/<host>/mihomo_server.yaml), so stored credentials
#     win over generation on repeated runs;
#   - the clash-format client nodes consumed by ak1ra_lab.network.mihomo_client
#     (config/client_outbounds/<host>.proxies.yaml).
# Every secret left empty on input (password "", users []) is generated with
# the ak1ra_lab.network.random_* lookup plugins (the control node's
# cryptographically secure random number generator).  The artifact
# writes run on the controller (delegate_to localhost, no privilege
# escalation).

- name: select the user names from the predefined pool
  no_log: true
  ansible.builtin.set_fact:
    _mihomo_server_selected_users: >-
      {{ mihomo_server_user_names[: mihomo_server_user_count | int] }}

# ── shadowsocks (single-user listener) ───────────────────────────────────────

# 2022-blake3 ciphers take a base64 key whose decoded length equals the cipher
# key length; classic ciphers take an arbitrary passphrase, for which a random
# 32-character string is generated.
- name: generate the shadowsocks server password
  when:
    - mihomo_server_enable_shadowsocks | ansible.builtin.bool
    - mihomo_server_shadowsocks_password == ""
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_shadowsocks_password: >-
      {{ lookup('ak1ra_lab.network.random_base64_key',
                bytes=_mihomo_server_shadowsocks_2022_key_length[mihomo_server_shadowsocks_method])
         if mihomo_server_shadowsocks_method in _mihomo_server_shadowsocks_2022_key_length
         else lookup('ak1ra_lab.network.random_password', length=32) }}

# ── trojan / hysteria2 / anytls ({name, password} users) ─────────────────────

- name: generate trojan users
  when:
    - mihomo_server_enable_trojan | ansible.builtin.bool
    - user_name not in (mihomo_server_trojan_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_trojan_users: >-
      {{ mihomo_server_trojan_users
         + [{'name': user_name,
             'password': lookup('ak1ra_lab.network.random_password', length=24)}] }}
  loop: "{{ _mihomo_server_selected_users }}"
  loop_control:
    loop_var: user_name

- name: generate hysteria2 obfs password
  when:
    - mihomo_server_enable_hysteria2 | ansible.builtin.bool
    - mihomo_server_hysteria2_obfs_enabled | ansible.builtin.bool
    - mihomo_server_hysteria2_obfs_password == ""
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_hysteria2_obfs_password: >-
      {{ lookup('ak1ra_lab.network.random_password', length=24) }}

- name: generate hysteria2 users
  when:
    - mihomo_server_enable_hysteria2 | ansible.builtin.bool
    - user_name not in (mihomo_server_hysteria2_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_hysteria2_users: >-
      {{ mihomo_server_hysteria2_users
         + [{'name': user_name,
             'password': lookup('ak1ra_lab.network.random_password', length=24)}] }}
  loop: "{{ _mihomo_server_selected_users }}"
  loop_control:
    loop_var: user_name

- name: generate anytls users
  when:
    - mihomo_server_enable_anytls | ansible.builtin.bool
    - user_name not in (mihomo_server_anytls_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_anytls_users: >-
      {{ mihomo_server_anytls_users
         + [{'name': user_name,
             'password': lookup('ak1ra_lab.network.random_password', length=24)}] }}
  loop: "{{ _mihomo_server_selected_users }}"
  loop_control:
    loop_var: user_name

# JLS is a second authentication layer; generate one independent credential per
# AnyTLS user (never reuse the AnyTLS password).  The filter requires a matching
# jls credential for every AnyTLS client node.
- name: generate anytls JLS users
  when:
    - mihomo_server_enable_anytls | ansible.builtin.bool
    - mihomo_server_anytls_security_mode == 'jls'
    - user_name not in (mihomo_server_anytls_jls_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_anytls_jls_users: >-
      {{ mihomo_server_anytls_jls_users
         + [{'name': user_name,
             'password': lookup('ak1ra_lab.network.random_password', length=24)}] }}
  loop: "{{ mihomo_server_anytls_users | map(attribute='name') | list }}"
  loop_control:
    loop_var: user_name

# ── vless ({name, uuid} users) ───────────────────────────────────────────────

- name: generate vless users
  when:
    - mihomo_server_enable_vless | ansible.builtin.bool
    - user_name not in (mihomo_server_vless_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_vless_users: >-
      {{ mihomo_server_vless_users
         + [{'name': user_name,
             'uuid': lookup('ak1ra_lab.network.random_uuid')}] }}
  loop: "{{ _mihomo_server_selected_users }}"
  loop_control:
    loop_var: user_name

# ── vless reality keypair / short id ─────────────────────────────────────────

- name: generate the vless reality keypair
  when:
    - mihomo_server_enable_vless | ansible.builtin.bool
    - mihomo_server_vless_reality_enabled | ansible.builtin.bool
    - mihomo_server_vless_reality_private_key == ""
    - mihomo_server_vless_reality_public_key == ""
  no_log: true
  ansible.builtin.command:
    argv:
      - "{{ mihomo_server_binary }}"
      - generate
      - reality-keypair
  register: _mihomo_server_reality_keypair
  changed_when: true

- name: record the generated vless reality keypair
  when:
    - _mihomo_server_reality_keypair is defined
    - _mihomo_server_reality_keypair.stdout is defined
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_vless_reality_private_key: "{{ _mihomo_server_reality_keypair.stdout | ansible.builtin.regex_findall('PrivateKey:\\s*(\\S+)') | first }}"
    mihomo_server_vless_reality_public_key: "{{ _mihomo_server_reality_keypair.stdout | ansible.builtin.regex_findall('PublicKey:\\s*(\\S+)') | first }}"

- name: generate the vless reality short id
  when:
    - mihomo_server_enable_vless | ansible.builtin.bool
    - mihomo_server_vless_reality_enabled | ansible.builtin.bool
    - mihomo_server_vless_reality_short_id == ""
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_vless_reality_short_id: >-
      {{ lookup('ak1ra_lab.network.random_password',
                length=16, alphabet='0123456789abcdef') }}

# ── tuic ({name, uuid, password} users) ──────────────────────────────────────

- name: generate tuic users
  when:
    - mihomo_server_enable_tuic | ansible.builtin.bool
    - user_name not in (mihomo_server_tuic_users | map(attribute='name') | list)
  no_log: true
  ansible.builtin.set_fact:
    mihomo_server_tuic_users: >-
      {{ mihomo_server_tuic_users
         + [{'name': user_name,
             'uuid': lookup('ak1ra_lab.network.random_uuid'),
             'password': lookup('ak1ra_lab.network.random_password', length=24)}] }}
  loop: "{{ _mihomo_server_selected_users }}"
  loop_control:
    loop_var: user_name

# ── local artifacts ──────────────────────────────────────────────────────────

- name: ensure the local artifact directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ mihomo_server_local_artifacts_dir }}"
    state: directory
    mode: "0700"

- name: ensure the host_vars directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ mihomo_server_host_vars_file | ansible.builtin.dirname }}"
    state: directory
    mode: "0755"

- name: save the generated credentials to host_vars
  delegate_to: localhost
  become: false
  no_log: true
  ansible.builtin.template:
    src: host_vars.yaml.j2
    dest: "{{ mihomo_server_host_vars_file }}"
    mode: "0600"

- name: write the clash-format client nodes
  delegate_to: localhost
  become: false
  no_log: true
  ansible.builtin.template:
    src: client_proxies.yaml.j2
    dest: "{{ mihomo_server_local_artifacts_dir }}/{{ inventory_hostname }}.proxies.yaml"
    mode: "0600"

- name: display the generated artifact locations
  become: false
  ansible.builtin.debug:
    msg:
      - "credentials:   {{ mihomo_server_host_vars_file }}"
      - "client nodes:  {{ mihomo_server_local_artifacts_dir }}/{{ inventory_hostname }}.proxies.yaml"
      - "generated {{ mihomo_server_user_count }} user(s): {{ _mihomo_server_selected_users | join(', ') }}"
