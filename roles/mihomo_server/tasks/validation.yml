---
# tasks/validation.yml - fail fast on contract violations before anything
# is touched.  The filter plugins re-validate the generated structures at
# render time; this file checks the role-level shape (and the facts that
# must fail clearly before credential generation).
#
# Checks are grouped by concern (state, identity, per-protocol options, TLS)
# so the failing task name and message identify the variable family that
# violates the contract.  Shape checks run in both states; checks that only
# matter for deployment are guarded with `mihomo_server_state: present`.

- name: validate mihomo_server_state
  ansible.builtin.assert:
    that:
      - mihomo_server_state in mihomo_server_state_available
    fail_msg: >-
      mihomo_server_state must be one of {{ mihomo_server_state_available }}
      (got: {{ mihomo_server_state }})
    quiet: true

- name: "validate the mihomo_server identity (mihomo_server_state: present)"
  when: mihomo_server_state == 'present'
  ansible.builtin.assert:
    that:
      - mihomo_server_hostname | length > 0
      - mihomo_server_region | length > 0
      - mihomo_server_region is not ansible.builtin.search('\s')
    fail_msg: |
      mihomo_server identity is invalid:
        mihomo_server_hostname must not be empty (got: {{ mihomo_server_hostname }})
        mihomo_server_region must be a non-empty, whitespace-free token
        (e.g. US/HK) that the client region regex can match
        (got: {{ mihomo_server_region }})
    quiet: true

- name: validate mihomo_server_user_count
  ansible.builtin.assert:
    that:
      - mihomo_server_user_count | int >= 1
      - mihomo_server_user_count | int <= 10
    fail_msg: >-
      mihomo_server_user_count must be within 1..10
      (got: {{ mihomo_server_user_count }})
    quiet: true

- name: validate the mihomo_server user list types
  ansible.builtin.assert:
    that:
      - mihomo_server_trojan_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_hysteria2_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_vless_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_tuic_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_anytls_users | ansible.builtin.type_debug == 'list'
    fail_msg: |
      mihomo_server user lists must be lists of {name, password, uuid?}
      mappings, got:
        trojan:    {{ mihomo_server_trojan_users | ansible.builtin.type_debug }}
        hysteria2: {{ mihomo_server_hysteria2_users | ansible.builtin.type_debug }}
        vless:     {{ mihomo_server_vless_users | ansible.builtin.type_debug }}
        tuic:      {{ mihomo_server_tuic_users | ansible.builtin.type_debug }}
        anytls:    {{ mihomo_server_anytls_users | ansible.builtin.type_debug }}
    quiet: true

- name: validate the mihomo_server vless REALITY option types
  ansible.builtin.assert:
    that:
      - mihomo_server_vless_reality_dest is string
      - mihomo_server_vless_reality_private_key is string
      - mihomo_server_vless_reality_public_key is string
      - mihomo_server_vless_reality_short_id is string
      - mihomo_server_vless_reality_server_names | ansible.builtin.type_debug == 'list'
      - mihomo_server_vless_reality_client_fingerprint is string
      - mihomo_server_vless_reality_support_x25519mlkem768 | ansible.builtin.type_debug == 'bool'
    fail_msg: |
      mihomo_server vless REALITY options have invalid types:
        dest/private_key/public_key/short_id/client_fingerprint must be
        strings, server_names must be a list, and
        support_x25519mlkem768 must be a boolean
    quiet: true

- name: validate the mihomo_server anytls option types
  ansible.builtin.assert:
    that:
      - mihomo_server_anytls_security_mode in ['certificate', 'jls']
      - mihomo_server_anytls_jls_dest is string
      - mihomo_server_anytls_jls_sni is string
      - mihomo_server_anytls_jls_alpn | ansible.builtin.type_debug == 'list'
      - mihomo_server_anytls_jls_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_anytls_jls_rate_limit | int >= 0
      - mihomo_server_anytls_padding_scheme is string
    fail_msg: |
      mihomo_server anytls options are invalid:
        security_mode must be certificate or jls (got: {{ mihomo_server_anytls_security_mode }})
        jls_dest/jls_sni/padding_scheme must be strings,
        jls_alpn/jls_users must be lists, and jls_rate_limit must be >= 0
        (got: {{ mihomo_server_anytls_jls_rate_limit }})
    quiet: true

- name: validate the mihomo_server listener and client option types
  ansible.builtin.assert:
    that:
      - mihomo_server_extra_listeners | ansible.builtin.type_debug == 'list'
      - mihomo_server_alpn | ansible.builtin.type_debug == 'list'
    fail_msg: |
      mihomo_server_extra_listeners and mihomo_server_alpn must be lists, got:
        extra_listeners: {{ mihomo_server_extra_listeners | ansible.builtin.type_debug }}
        alpn:            {{ mihomo_server_alpn | ansible.builtin.type_debug }}
    quiet: true

- name: validate the mihomo_server TLS option types
  ansible.builtin.assert:
    that:
      - mihomo_server_tls_dir is string
      - mihomo_server_tls_source_certificate_path is string
      - mihomo_server_tls_source_key_path is string
      - mihomo_server_tls_renewal_hook_path is string
    fail_msg: >-
      mihomo_server_tls_dir, mihomo_server_tls_source_certificate_path,
      mihomo_server_tls_source_key_path and mihomo_server_tls_renewal_hook_path
      must be strings
    quiet: true

- name: "validate the mihomo_server shadowsocks listener (mihomo_server_state: present)"
  when:
    - mihomo_server_state == 'present'
    - mihomo_server_enable_shadowsocks | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - mihomo_server_shadowsocks_method | length > 0
    fail_msg: >-
      mihomo_server_enable_shadowsocks requires a non-empty
      mihomo_server_shadowsocks_method (got:
      {{ mihomo_server_shadowsocks_method }})
    quiet: true

- name: "validate the mihomo_server vless REALITY settings (mihomo_server_state: present)"
  when:
    - mihomo_server_state == 'present'
    - mihomo_server_enable_vless | ansible.builtin.bool
    - mihomo_server_vless_reality_enabled | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - mihomo_server_vless_reality_dest is ansible.builtin.match('^.+:[0-9]+$')
      - >-
        (mihomo_server_vless_reality_private_key | length > 0)
        == (mihomo_server_vless_reality_public_key | length > 0)
      - >-
        (mihomo_server_vless_reality_short_id | length == 0)
        or ((mihomo_server_vless_reality_short_id is ansible.builtin.match('^[0-9a-fA-F]{2,16}$'))
            and ((mihomo_server_vless_reality_short_id | length) % 2 == 0))
      - mihomo_server_vless_reality_client_fingerprint | length > 0
    fail_msg: |
      mihomo_server vless REALITY settings are invalid:
        mihomo_server_vless_reality_dest must be host:port
        (got: {{ mihomo_server_vless_reality_dest }})
        mihomo_server_vless_reality_private_key and
        mihomo_server_vless_reality_public_key must be supplied together, or
        both left empty for generation
        (private={{ 'set' if mihomo_server_vless_reality_private_key | length > 0 else 'empty' }},
        public={{ 'set' if mihomo_server_vless_reality_public_key | length > 0 else 'empty' }})
        mihomo_server_vless_reality_short_id must be empty or even-length hex
        (2-16 chars) when set
        (got: {{ mihomo_server_vless_reality_short_id }})
        mihomo_server_vless_reality_client_fingerprint must not be empty
    quiet: true

- name: "validate the mihomo_server anytls security mode (mihomo_server_state: present)"
  when: mihomo_server_state == 'present'
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_server_anytls_security_mode == 'certificate')
        or (mihomo_server_enable_anytls | ansible.builtin.bool)
    fail_msg: >-
      mihomo_server_anytls_security_mode is 'jls' but
      mihomo_server_enable_anytls is false; JLS requires the anytls listener
    quiet: true

- name: "validate the mihomo_server anytls JLS settings (mihomo_server_state: present)"
  when:
    - mihomo_server_state == 'present'
    - mihomo_server_anytls_security_mode == 'jls'
  ansible.builtin.assert:
    that:
      - mihomo_server_anytls_jls_dest is ansible.builtin.match('^.+:[0-9]+$')
      - >-
        (mihomo_server_anytls_jls_sni | length == 0)
        or (mihomo_server_anytls_jls_sni is not ansible.builtin.search('\s'))
    fail_msg: |
      mihomo_server anytls JLS settings are invalid:
        mihomo_server_anytls_jls_dest must be host:port
        (got: {{ mihomo_server_anytls_jls_dest }})
        mihomo_server_anytls_jls_sni, when set, must be a whitespace-free DNS
        name (got: {{ mihomo_server_anytls_jls_sni }})
    quiet: true

- name: "validate the mihomo_server TLS source pair (mihomo_server_state: present)"
  when: mihomo_server_state == 'present'
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_server_tls_source_certificate_path | length > 0)
        == (mihomo_server_tls_source_key_path | length > 0)
    fail_msg: >-
      mihomo_server_tls_source_certificate_path and
      mihomo_server_tls_source_key_path must be set together
      (certificate={{ 'set' if mihomo_server_tls_source_certificate_path | length > 0 else 'empty' }},
      key={{ 'set' if mihomo_server_tls_source_key_path | length > 0 else 'empty' }})
    quiet: true

- name: "validate the mihomo_server TLS destination paths (mihomo_server_state: present)"
  when: mihomo_server_state == 'present'
  ansible.builtin.assert:
    that:
      - >-
        (mihomo_server_tls_source_certificate_path | length == 0)
        or ((mihomo_server_tls_dir is ansible.builtin.match('^/'))
            and (mihomo_server_tls_certificate_path | length > 0)
            and (mihomo_server_tls_key_path | length > 0))
      - >-
        (mihomo_server_tls_certificate_path | length == 0)
        or (mihomo_server_tls_certificate_path is ansible.builtin.match('^/'))
      - >-
        (mihomo_server_tls_key_path | length == 0)
        or (mihomo_server_tls_key_path is ansible.builtin.match('^/'))
    fail_msg: |
      mihomo_server TLS destination paths are invalid:
        with a source pair, mihomo_server_tls_dir must be absolute and
        mihomo_server_tls_certificate_path / mihomo_server_tls_key_path must
        be non-empty; destination paths must be absolute when set.
        Got tls_dir={{ mihomo_server_tls_dir }}
        certificate={{ mihomo_server_tls_certificate_path }}
        key={{ mihomo_server_tls_key_path }}
    quiet: true

- name: "validate the mihomo_server TLS renewal hook (mihomo_server_state: present)"
  when:
    - mihomo_server_state == 'present'
    - mihomo_server_tls_renewal_hook_enabled | ansible.builtin.bool
  ansible.builtin.assert:
    that:
      - (mihomo_server_tls_source_certificate_path | length > 0)
      - (mihomo_server_tls_source_key_path | length > 0)
      - mihomo_server_tls_renewal_hook_path is ansible.builtin.match('^/')
    fail_msg: |
      mihomo_server_tls_renewal_hook_enabled requires the TLS source pair and
      an absolute renewal hook path:
        source certificate: {{ 'set' if mihomo_server_tls_source_certificate_path | length > 0 else 'empty' }}
        source key:         {{ 'set' if mihomo_server_tls_source_key_path | length > 0 else 'empty' }}
        hook path:          {{ mihomo_server_tls_renewal_hook_path }}
    quiet: true

- name: "validate the mihomo_server TLS requirements (mihomo_server_state: present)"
  when: mihomo_server_state == 'present'
  vars:
    _mihomo_server_tls_required: >-
      {{ (mihomo_server_enable_trojan | ansible.builtin.bool)
         or (mihomo_server_enable_hysteria2 | ansible.builtin.bool)
         or ((mihomo_server_enable_vless | ansible.builtin.bool)
             and not (mihomo_server_vless_reality_enabled | ansible.builtin.bool))
         or (mihomo_server_enable_tuic | ansible.builtin.bool)
         or ((mihomo_server_enable_anytls | ansible.builtin.bool)
             and mihomo_server_anytls_security_mode != 'jls') }}
  ansible.builtin.assert:
    that:
      - >-
        not (_mihomo_server_tls_required | ansible.builtin.bool)
        or ((mihomo_server_tls_certificate_path | length > 0)
            and (mihomo_server_tls_key_path | length > 0))
    fail_msg: |
      TLS-using protocols are enabled (trojan, hysteria2, tuic, vless without
      REALITY, anytls in certificate mode) but the certificate/key paths are
      not both set; mihomo has no built-in ACME.
        certificate: {{ 'set' if mihomo_server_tls_certificate_path | length > 0 else 'empty' }}
        key:         {{ 'set' if mihomo_server_tls_key_path | length > 0 else 'empty' }}
    quiet: true
