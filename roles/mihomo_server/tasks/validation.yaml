---
# tasks/validation.yaml - fail fast on contract violations before anything
# is touched.  The filter plugins re-validate the generated structures at
# render time; this file checks the role-level shape (and the facts that
# must fail clearly before credential generation).

- name: validate the mihomo_server contract
  ansible.builtin.assert:
    that:
      - mihomo_server_state in mihomo_server_state_available
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_hostname | length > 0)
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_region | length > 0)
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_region is not ansible.builtin.search('\s'))
      - mihomo_server_user_count | int >= 1
      - mihomo_server_user_count | int <= 10
      - mihomo_server_trojan_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_hysteria2_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_vless_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_vless_reality_dest is string
      - mihomo_server_vless_reality_private_key is string
      - mihomo_server_vless_reality_public_key is string
      - mihomo_server_vless_reality_short_id is string
      - mihomo_server_vless_reality_server_names | ansible.builtin.type_debug == 'list'
      - mihomo_server_vless_reality_client_fingerprint is string
      - mihomo_server_tuic_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_anytls_users | ansible.builtin.type_debug == 'list'
      - mihomo_server_extra_listeners | ansible.builtin.type_debug == 'list'
      - mihomo_server_alpn | ansible.builtin.type_debug == 'list'
      - mihomo_server_tls_dir is string
      - mihomo_server_tls_source_certificate_path is string
      - mihomo_server_tls_source_key_path is string
      - mihomo_server_tls_renewal_hook_path is string
      - >-
        (mihomo_server_state == 'absent')
        or ((mihomo_server_tls_source_certificate_path | length > 0)
            == (mihomo_server_tls_source_key_path | length > 0))
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_tls_source_certificate_path | length == 0)
        or (mihomo_server_tls_dir is ansible.builtin.match('^/')
            and mihomo_server_tls_certificate_path | length > 0
            and mihomo_server_tls_key_path | length > 0)
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_tls_certificate_path | length == 0)
        or (mihomo_server_tls_certificate_path is ansible.builtin.match('^/'))
      - >-
        (mihomo_server_state == 'absent')
        or (mihomo_server_tls_key_path | length == 0)
        or (mihomo_server_tls_key_path is ansible.builtin.match('^/'))
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_tls_renewal_hook_enabled | ansible.builtin.bool)
        or ((mihomo_server_tls_source_certificate_path | length > 0)
            and (mihomo_server_tls_source_key_path | length > 0))
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_tls_renewal_hook_enabled | ansible.builtin.bool)
        or (mihomo_server_tls_renewal_hook_path is ansible.builtin.match('^/'))
      - >-
        (mihomo_server_state == 'absent')
        or (not mihomo_server_enable_shadowsocks | ansible.builtin.bool)
        or (mihomo_server_shadowsocks_method | length > 0)
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_vless_reality_enabled | ansible.builtin.bool)
        or (mihomo_server_enable_vless | ansible.builtin.bool)
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_vless_reality_enabled | ansible.builtin.bool)
        or (mihomo_server_vless_reality_dest is ansible.builtin.match('^.+:[0-9]+$'))
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_vless_reality_enabled | ansible.builtin.bool)
        or ((mihomo_server_vless_reality_private_key | length > 0)
            == (mihomo_server_vless_reality_public_key | length > 0))
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_vless_reality_enabled | ansible.builtin.bool)
        or (mihomo_server_vless_reality_short_id | length == 0)
        or ((mihomo_server_vless_reality_short_id is ansible.builtin.match('^[0-9a-fA-F]{2,16}$'))
            and ((mihomo_server_vless_reality_short_id | length) % 2 == 0))
      - >-
        (mihomo_server_state == 'absent')
        or not (mihomo_server_vless_reality_enabled | ansible.builtin.bool)
        or (mihomo_server_vless_reality_client_fingerprint | length > 0)
      - >-
        (mihomo_server_state == 'absent')
        or (not (mihomo_server_enable_trojan | ansible.builtin.bool
                 or mihomo_server_enable_hysteria2 | ansible.builtin.bool
                 or (mihomo_server_enable_vless | ansible.builtin.bool
                     and not (mihomo_server_vless_reality_enabled | ansible.builtin.bool))
                 or mihomo_server_enable_tuic | ansible.builtin.bool
                 or mihomo_server_enable_anytls | ansible.builtin.bool))
        or ((mihomo_server_tls_certificate_path | length > 0)
            and (mihomo_server_tls_key_path | length > 0))
    fail_msg: |
      mihomo_server variables violate the role contract:
        state in {{ mihomo_server_state_available }} (got: {{ mihomo_server_state }})
        mihomo_server_region must be a whitespace-free token (e.g. US/HK) that
        the client region regex can match
        mihomo_server_user_count must be within 1..10
        *_users must be lists of {name, password, uuid?} mappings
        shadowsocks_method must not be empty
        TLS-using protocols require mihomo_server_tls_certificate_path and
        mihomo_server_tls_key_path (mihomo has no built-in ACME), except
        VLESS with REALITY enabled
        VLESS REALITY requires enable_vless, a dest host:port, and the
        private/public keys supplied together (or both empty for generation);
        short_id must be even-length hex (2-16 chars) when set
        mihomo_server_tls_source_certificate_path and
        mihomo_server_tls_source_key_path must be set together; when set, the
        role copies them to the destination paths under an absolute
        mihomo_server_tls_dir
        mihomo_server_tls_renewal_hook_enabled requires the source pair and an
        absolute mihomo_server_tls_renewal_hook_path
    quiet: true
