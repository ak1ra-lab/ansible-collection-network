---
# ak1ra_lab.network.mihomo_server - public variable contract
#
# Deploys mihomo on a VPS as a proxy server (the `listeners:` schema) and
# writes the matching client artifacts for ak1ra_lab.network.mihomo_client:
#   - <local artifacts dir>/<host>.config.yaml   server config copy
#   - <local artifacts dir>/<host>.proxies.yaml  clash-format client nodes
#   - <host_vars file>                           generated credentials
#
# mihomo schema facts the contract is built on:
#   - the shadowsocks listener is single-user (one cipher + password, no
#     users field), so mihomo_server_shadowsocks_users does not exist;
#   - trojan takes a users list, hysteria2/tuic/anytls a name/uuid -> password
#     mapping - users are declared here in one uniform shape
#     ({name, password, uuid?}) and mapped by the filter plugin;
#   - TLS is flat certificate/private-key paths (vless REALITY uses
#     reality-config instead) and mihomo has no built-in ACME, so
#     certificates are provisioned out of band (manual mode).

# ── Lifecycle ────────────────────────────────────────────────────────────────

mihomo_server_state: present

# ── Server identity (TLS SNI / region token) ─────────────────────────────────

# TLS SNI and the client node's server address.
mihomo_server_hostname: "{{ ansible_facts['fqdn'] }}"

# Region token embedded in the generated client node names
# (selfhost-<REGION>-<host>[-<user>]-<proto>).  Must be a token the client's
# region regex matches, e.g. "US", "HK", "JP"; required when state=present.
mihomo_server_region: ""

# ── General ──────────────────────────────────────────────────────────────────

mihomo_server_log_level: warning
mihomo_server_listen: "0.0.0.0"
# Optional Clash API on the server; empty disables it.  Set
# mihomo_server_external_controller_secret when exposing it beyond localhost.
mihomo_server_external_controller: ""
mihomo_server_external_controller_secret: ""

# ── Protocol switches and ports ──────────────────────────────────────────────
#
# Default profile: shadowsocks (certificate-free fallback), vless with
# REALITY + XTLS Vision (TCP primary), hysteria2 (UDP fast path) and anytls
# (TLS/TCP fallback) are enabled; trojan and tuic are opt-in.  Every protocol
# stays available through its switch.
#
# Ports are plain role defaults, not a protocol convention: 9442-9447 keep
# the listeners in one predictable block and avoid the historical
# shadowsocks 8388 / alt-HTTPS 8443 values.  They are not a compatibility
# contract, and every value maps to mihomo's own listener schema.

mihomo_server_user_count: 1

mihomo_server_enable_shadowsocks: true
mihomo_server_shadowsocks_port: 9442
mihomo_server_shadowsocks_method: "2022-blake3-aes-128-gcm"
# Server password (base64, decoded length = cipher key length); generated
# when empty.  Single-user: no per-user shadowsocks passwords.
mihomo_server_shadowsocks_password: ""

mihomo_server_enable_trojan: false
mihomo_server_trojan_port: 9443
# Users: [{name, password}] (generated when empty)
mihomo_server_trojan_users: []

mihomo_server_enable_hysteria2: true
mihomo_server_hysteria2_port: 9444
# Users: [{name, password}] (generated when empty)
mihomo_server_hysteria2_users: []
# Server-side Brutal bandwidth caps in Mbps (0 = omit).  These are the
# *server's* upload/download rates and apply per client; the generated client
# nodes never inherit them.  With no client bandwidth mihomo uses BBR, where
# these caps are inert - set them only when clients opt into Brutal.
mihomo_server_hysteria2_up_mbps: 0
mihomo_server_hysteria2_down_mbps: 0
mihomo_server_hysteria2_obfs_enabled: false
mihomo_server_hysteria2_obfs_password: ""
mihomo_server_hysteria2_masquerade_enabled: true
mihomo_server_hysteria2_masquerade_url: "https://www.bing.com"

mihomo_server_enable_vless: true
mihomo_server_vless_port: 9445
# Users: [{name, uuid}] (generated when empty)
mihomo_server_vless_users: []
# XTLS Vision is the default with REALITY; set it to "" for plain vless.
mihomo_server_vless_flow: "xtls-rprx-vision"

# VLESS REALITY (server side).  When enabled, the vless listener uses
# reality-config instead of certificate/private-key; clients use reality-opts.
# The X25519 keypair is generated on the target with
# `mihomo generate reality-keypair` when both keys are empty and persisted to
# host_vars.  dest must be a reachable TLS 1.3 site; server_names defaults to
# the dest host when the list is empty.  short_id is generated when empty.
mihomo_server_vless_reality_enabled: true
mihomo_server_vless_reality_dest: "www.microsoft.com:443"
mihomo_server_vless_reality_private_key: ""
mihomo_server_vless_reality_public_key: ""
mihomo_server_vless_reality_short_id: ""
mihomo_server_vless_reality_server_names: []
mihomo_server_vless_reality_client_fingerprint: "chrome"

mihomo_server_enable_tuic: false
mihomo_server_tuic_port: 9446
# Users: [{name, uuid, password}] (generated when empty)
mihomo_server_tuic_users: []
mihomo_server_tuic_congestion_control: bbr

mihomo_server_enable_anytls: true
mihomo_server_anytls_port: 9447
# Users: [{name, password}] (generated when empty)
mihomo_server_anytls_users: []
mihomo_server_anytls_padding_scheme: ""
# Client uTLS fingerprint.  Empty falls back to Go's standard-library TLS
# fingerprint; "chrome" keeps the generated node closer to browser traffic.
mihomo_server_anytls_client_fingerprint: "chrome"
# Client idle-session handling (mihomo defaults: 30/30/0).  A positive
# min_idle_session keeps warm sessions on high-RTT links at the cost of
# keeping connections open.
mihomo_server_anytls_idle_session_check_interval: 30
mihomo_server_anytls_idle_session_timeout: 30
mihomo_server_anytls_min_idle_session: 0

# Raw extra listeners appended to the generated ones (escape hatch for
# protocols the generated contract does not cover yet).  Each entry needs
# `name` and `type`; names must not collide with the generated listeners.
mihomo_server_extra_listeners: []

# ── TLS material ─────────────────────────────────────────────────────────────

# Destination paths referenced by the mihomo listeners.  In manual mode set
# them to an existing certificate/key pair readable by the mihomo service
# user.  When a source pair is configured below, the destination paths default
# to the role-managed copies under mihomo_server_tls_dir; the role deploys
# them with the service group (0640 root:mihomo).
mihomo_server_tls_dir: /etc/mihomo/tls
mihomo_server_tls_certificate_path: >-
  {{ (mihomo_server_tls_dir ~ '/fullchain.pem')
     if mihomo_server_tls_source_certificate_path | length > 0 else '' }}
mihomo_server_tls_key_path: >-
  {{ (mihomo_server_tls_dir ~ '/privkey.pem')
     if mihomo_server_tls_source_key_path | length > 0 else '' }}

# Optional source pair on the target.  Set both to let the role copy the
# certificate/key into the destination paths above; this is the certbot
# integration point (certbot's live/ files are root-only, so the mihomo
# service cannot read them in place).  The copy is idempotent and runs on
# every apply; the optional renewal hook below covers renewals between runs.
mihomo_server_tls_source_certificate_path: ""
mihomo_server_tls_source_key_path: ""

# Collection playbook switch: when true, playbooks/mihomo_server.yaml applies
# ak1ra_lab.general.certbot first and derives the source paths/hook below.
# The role itself never calls certbot; direct role users can leave this false
# and set the source pair and hook explicitly instead.
mihomo_server_tls_certbot_enabled: false

# Install a certbot deploy hook that re-copies the source pair and reloads
# mihomo after a renewal.  The hook is independent of the certbot role's own
# certbot-deploy-hooks.sh, so both can coexist.  Requires the source pair.
mihomo_server_tls_renewal_hook_enabled: "{{ mihomo_server_tls_certbot_enabled | ansible.builtin.bool }}"
mihomo_server_tls_renewal_hook_path: /etc/letsencrypt/renewal-hooks/deploy/mihomo-server.sh

# ALPN for hysteria2/tuic listeners (and their generated client nodes).
mihomo_server_alpn:
  - h3

# ── Client artifacts ─────────────────────────────────────────────────────────

# Prefix of the generated client node names
# (<prefix>-<REGION>-<host>[-<user>]-<proto>).  The client's region regexes
# pick the nodes up in both profiles; the prefix is also the self-hosted tag
# (`selfhost|自建` by default) used by the optional selfhost-tier profile.
mihomo_server_client_node_prefix: selfhost

# Controller-local output locations.  The artifacts dir mirrors the
# sing-box-tproxy flow (`<repo>/config/client_outbounds/`); host_vars must
# live next to the playbook (the default does) so Ansible auto-loads the
# generated credentials on later runs - a file outside the auto-load
# locations is treated as absent and regenerated every run.
mihomo_server_local_artifacts_dir: >-
  {{ playbook_dir | ansible.builtin.dirname }}/config/client_outbounds
mihomo_server_host_vars_file: >-
  {{ playbook_dir }}/host_vars/{{ inventory_hostname }}/mihomo_server.yaml
