---
# ak1ra_lab.network.systemd_netns - role-internal values (do not override)
#
# Kept out of defaults/main.yaml so the public contract stays short: these
# are convention values that stay the same across every invocation on a
# host, or derived names that must not diverge from their inputs.

# Declarative state choices.
systemd_netns_state_available: [present, absent]

# Exit-IP echo service used by the verification task (both checks use curl
# for consistent behavior).
systemd_netns_verify_url: https://ip.sb

# Derived names and values (do not modify manually)
#
# Kernel interface names are capped at 15 characters (IFNAMSIZ), so the veth
# ends cannot embed systemd_netns_name directly.  They use a short prefix
# plus the first 10 hex chars of the namespace name's sha256 digest, plus a
# per-leg index (vh-<10 hex>-<leg> = 15 chars max): deterministic across
# runs, unique per namespace, short regardless of systemd_netns_name length
# or the number of legs.
_systemd_netns_veth_host_prefix: vh-{{ (systemd_netns_name | ansible.builtin.hash('sha256'))[:10] }}
_systemd_netns_veth_ns_prefix: vn-{{ (systemd_netns_name | ansible.builtin.hash('sha256'))[:10] }}
_systemd_netns_service: netns-{{ systemd_netns_name }}.service
