---
# Self-contained validation of the public variable contract.
# Runs first in tasks/main.yaml so the role fails fast without any external
# validation role.
#
# Contract checks split in two layers:
#   - always: state, name and the shared runtime options
#   - state: present only - the bridged topology the namespace is built from
#     (declared links, referenced bridges).  Teardown (absent) needs only the
#     namespace name - everything else it removes is name-derived and is
#     discovered from the host itself.

- name: validate systemd_netns_state
  ansible.builtin.assert:
    that:
      - systemd_netns_state in systemd_netns_state_available
    fail_msg: |
      systemd_netns_state must be one of: {{ systemd_netns_state_available }}
      (got: {{ systemd_netns_state }})
    quiet: true

- name: validate systemd_netns_name
  ansible.builtin.assert:
    that:
      - systemd_netns_name is ansible.builtin.match('^[a-zA-Z_][a-zA-Z0-9_.-]*$')
    fail_msg: >-
      systemd_netns_name must match ^[a-zA-Z_][a-zA-Z0-9_.-]*$ so it is a valid
      ip netns name and systemd unit name component
      (got: {{ systemd_netns_name }})
    quiet: true

- name: "validate bridged topology (systemd_netns_state: present)"
  when: systemd_netns_state == 'present'
  block:
    - name: validate systemd_netns_links type
      ansible.builtin.assert:
        that:
          - systemd_netns_links | ansible.builtin.type_debug == "list"
        fail_msg: "systemd_netns_links must be a list of {bridge, address, gateway?} dicts."
        quiet: true

    - name: validate systemd_netns_links element keys
      ansible.builtin.assert:
        that:
          - link.bridge is defined
          - link.address is defined
        fail_msg: >-
          systemd_netns_links elements must define bridge and address
          (got: {{ link }})
        quiet: true
      loop: "{{ systemd_netns_links }}"
      loop_control:
        loop_var: link
        label: "{{ link.bridge | default('?') }}"

    - name: validate systemd_netns_links addresses, gateways and MACs
      vars:
        _link_addr_valid: >-
          {{ link.address is defined
             and (link.address | ansible.utils.ipaddr('ipv4')) is ansible.builtin.truthy }}
        _link_prefix: "{{ (link.address | ansible.utils.ipaddr('prefix') | int) if _link_addr_valid else 0 }}"
        _gateway_is_host: >-
          {{ (not (link.gateway is defined))
             or (((link.gateway | ansible.utils.ipaddr('ipv4')) is ansible.builtin.truthy)
                 and not ('/' in link.gateway)) }}
        _gateway_in_network: >-
          {{ (not (link.gateway is defined and _link_addr_valid and _gateway_is_host))
             or (link.gateway is ansible.utils.in_network(link.address | ansible.utils.ipaddr('subnet'))) }}
      ansible.builtin.assert:
        that:
          - _link_addr_valid
          - _link_prefix >= 1
          - _link_prefix <= 32
          - _gateway_is_host
          - _gateway_in_network
          - >-
            (not (link.mac is defined))
            or (link.mac is ansible.builtin.match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$'))
        fail_msg: >-
          systemd_netns_links addresses must be canonical IPv4 CIDRs
          (a.b.c.d/prefix, prefix 1-32); gateway, when set, must be a bare IPv4
          host address inside the address network (the kernel rejects an
          off-subnet next hop with 'Nexthop has invalid gateway'); mac, when set,
          must look like aa:bb:cc:dd:ee:ff.
          Offending element: {{ link }}
        quiet: true
      loop: "{{ systemd_netns_links }}"
      loop_control:
        loop_var: link
        label: "{{ link.address | default('?') }}"

    - name: validate at most one default-route leg
      ansible.builtin.assert:
        that:
          - systemd_netns_links | selectattr('gateway', 'defined') | list | length <= 1
        fail_msg: >-
          at most one systemd_netns_links element may declare a gateway: the
          namespace has a single default route, so only that leg can own it.
          Offending elements: {{ systemd_netns_links }}
        quiet: true

    - name: "check referenced bridges exist at run time"
      ansible.builtin.command:
        argv:
          - /usr/bin/ip
          - -o
          - link
          - show
          - dev
          - "{{ link.bridge }}"
      changed_when: false
      failed_when: false
      register: _systemd_netns_bridge_probe
      loop: "{{ systemd_netns_links }}"
      loop_control:
        loop_var: link
        label: "{{ link.bridge }}"

    - name: assert referenced bridges exist
      ansible.builtin.assert:
        that:
          - probe.rc == 0
        fail_msg: >-
          systemd_netns_links[].bridge must name a bridge that already exists on
          the host.  Bridges are owned by ak1ra_lab.network.systemd_bridge (or
          the host's own network configuration); run that role first or create
          the bridge beforehand.  Missing: {{ probe.link.bridge }}
        quiet: true
      loop: "{{ _systemd_netns_bridge_probe.results }}"
      loop_control:
        loop_var: probe
        label: "{{ probe.link.bridge }}"

    - name: "check referenced bridges carry an enslaved member"
      ansible.builtin.command:
        argv:
          - /usr/bin/ip
          - -o
          - link
          - show
          - master
          - "{{ bridge_name }}"
      changed_when: false
      failed_when: false
      register: _systemd_netns_bridge_members_probe
      loop: "{{ systemd_netns_links | map(attribute='bridge') | ansible.builtin.unique | list }}"
      loop_control:
        loop_var: bridge_name
        label: "{{ bridge_name }}"

    - name: assert referenced bridges have at least one enslaved member
      ansible.builtin.assert:
        that:
          - member_probe.rc == 0
          - member_probe.stdout_lines | length >= 1
        fail_msg: >-
          systemd_netns_links[].bridge must name a bridge with at least one
          enslaved member interface: a bridge without any uplink is an L2
          island the namespace cannot exit through.  Enslave a physical
          interface to it (declare it on the bridge in
          ak1ra_lab.network.systemd_bridge) before running this role.
          Offending bridge: {{ member_probe.bridge_name }}
        quiet: true
      loop: "{{ _systemd_netns_bridge_members_probe.results }}"
      loop_control:
        loop_var: member_probe
        label: "{{ member_probe.bridge_name }}"

- name: validate systemd_netns_hook_services type
  ansible.builtin.assert:
    that:
      - systemd_netns_hook_services | ansible.builtin.type_debug == "list"
    fail_msg: "systemd_netns_hook_services must be a list of systemd unit names."
    quiet: true

- name: validate systemd_netns_hook_services elements
  ansible.builtin.assert:
    that:
      - service is ansible.builtin.match('^[a-zA-Z0-9@_.:-]+\.service$')
    fail_msg: >-
      systemd_netns_hook_services elements must be systemd unit names ending
      in .service (e.g. "qbittorrent-nox@.service").
      Offending element: {{ service }}
    quiet: true
  loop: "{{ systemd_netns_hook_services }}"
  loop_control:
    loop_var: service

- name: validate systemd_netns_sysctl_params type
  ansible.builtin.assert:
    that:
      - systemd_netns_sysctl_params | ansible.builtin.type_debug == "dict"
    fail_msg: >-
      systemd_netns_sysctl_params must be a dict mapping full dotted sysctl
      names to their values (e.g. {net.ipv4.tcp_congestion_control: bbr}).
    quiet: true

- name: validate systemd_netns_sysctl_params keys and values
  ansible.builtin.assert:
    that:
      - sysctl_key is ansible.builtin.match('^[a-z0-9_.-]+$')
      - sysctl_value | ansible.builtin.type_debug not in ["list", "dict"]
    fail_msg: >-
      systemd_netns_sysctl_params keys must be full dotted sysctl names
      (lowercase letters, digits, dots); values must be scalars rendered
      verbatim after key= (quote multi-value strings like tcp_wmem).
      Offending entry: {{ sysctl_key }}: {{ sysctl_value }}
    quiet: true
  loop: "{{ systemd_netns_sysctl_params | ansible.builtin.dict2items }}"
  loop_control:
    loop_var: sysctl_entry
    label: "{{ sysctl_entry.key }}"
  vars:
    sysctl_key: "{{ sysctl_entry.key }}"
    sysctl_value: "{{ sysctl_entry.value }}"

- name: validate systemd_netns_dns_servers type
  ansible.builtin.assert:
    that:
      - systemd_netns_dns_servers | ansible.builtin.type_debug == "list"
    fail_msg: "systemd_netns_dns_servers must be a list of nameserver addresses."
    quiet: true

- name: validate systemd_netns_verify_url
  ansible.builtin.assert:
    that:
      - systemd_netns_verify_url.startswith('https://')
    fail_msg: "systemd_netns_verify_url must be an https:// URL."
    quiet: true
  when: systemd_netns_verify | ansible.builtin.bool
