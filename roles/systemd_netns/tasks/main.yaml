---
# tasks file for ak1ra_lab.network.systemd_netns
# Dispatcher: validation first, then branch on systemd_netns_state.

- name: validate contract variables
  ansible.builtin.import_tasks: validation.yaml

- name: "tear down managed artifacts (systemd_netns_state: absent)"
  when: systemd_netns_state == 'absent'
  ansible.builtin.import_tasks: reset.yaml

- name: "apply namespace infrastructure (systemd_netns_state: present)"
  when: systemd_netns_state == 'present'
  ansible.builtin.import_tasks: present.yaml
