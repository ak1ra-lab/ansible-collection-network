---
# ak1ra_lab.network.systemd_netns - public variable contract
#
# Bridged-segment egress isolation: systemd services run inside a network
# namespace that attaches veth legs to host-level Linux bridges (created and
# owned by ak1ra_lab.network.systemd_bridge or the host's own network
# configuration layer).  The namespace carries real segment addresses and its
# default route via the leg that declares a gateway - the host does no
# routing, NAT or filtering for this traffic (pure L2).

# Declarative state:
#   present - apply the namespace infrastructure
#   absent  - tear down everything this role created (namespace, veth legs,
#             resolv.conf, hook drop-ins, unit).  Bridges are shared
#             infrastructure owned by ak1ra_lab.network.systemd_bridge (or
#             the host's own network layer) and are never touched by this
#             role.
systemd_netns_state: present

# Namespace identifier.  Doubles as the unit name component
# (netns-<name>.service), the /etc/netns/<name> resolv.conf directory and
# other per-invocation names, so it must be a valid ip netns name and systemd
# unit name component.  The default follows the role's reference workload
# (see systemd_netns_sysctl_params); run the role once per namespace with a
# distinct name.
systemd_netns_name: qbittorrent

# veth legs between the namespace and the host-level bridges (one veth pair
# per leg, container-style: one leg per network segment).  The host end of
# each pair is a bridge port (L2 only), the namespace end carries the segment
# address.  At most one leg may declare a gateway; that leg owns the
# namespace's default route.
# Elements: {bridge, address, gateway?, mac?}, e.g.
#   - {bridge: br_wan, address: 10.255.0.245/24, gateway: 10.255.0.1, mac: "bc:24:11:a1:5c:50"}
# bridge:  name of an existing bridge on the host - regardless of its owner
#          (systemd_bridge, netplan, hand-rolled); existence and an enslaved
#          member are validated at run time, so the bridge must already be
#          created when the role runs
# address: canonical IPv4 CIDR assigned inside the namespace
# gateway: optional IPv4 next-hop of the default route (segment's router)
# mac:     optional MAC pinned to the namespace end (stable ARP/leases across
#          namespace recreations - veth MACs are random by default)
systemd_netns_links: []

# Resolvers for the namespace, written to the iproute2-convention path
# /etc/netns/<name>/resolv.conf (ip netns exec bind-mounts it automatically;
# systemd drop-ins bind this path directly).
systemd_netns_dns_servers:
  - 223.5.5.5
  - 119.29.29.29

# Optional systemd units to join to this namespace via a drop-in written at
# /etc/systemd/system/<unit>.d/netns.conf (NetworkNamespacePath= plus the
# PartOf=/Requires=/After= wiring).  The role only writes/removes the
# drop-in; it never enables, starts, restarts or otherwise manages these
# units.  Template units work by passing e.g. "qbittorrent-nox@.service".
systemd_netns_hook_services: []

# Disable IPv6 inside the namespace.  The bridged legs can carry IPv6, but
# segments are often v4-only; disabling avoids happy-eyeballs stalls when no
# v6 route exists.
systemd_netns_disable_ipv6: true

# Per-netns sysctls, re-applied after every namespace (re)creation via the
# netns unit's ExecStart (ip netns exec <name> sysctl -qw key=value);
# template changes restart the unit, and a restart re-runs ExecStart.  Keys
# are full dotted sysctl names, values render verbatim after key= (quote
# multi-value strings like tcp_wmem: "4096 16384 16777216").  Application
# order is map order - like sysctl, the last write wins.
#
# Only per-netns keys affect this namespace alone: net.ipv4.*, net.ipv6.*
# and conf.*, plus a few net.core.* keys (somaxconn, optmem_max, txrehash,
# verified on 6.12).  net.core.rmem_max / wmem_max / netdev_max_backlog and
# everything outside net.* are host-global even when written from inside
# the namespace - prefer namespaced keys.
#
# BitTorrent tuning candidates (A/B-test only, after observing nstat
# ListenOverflows / ListenDrops / UdpRcvbufErrors or EADDRNOTAVAIL
# connect() errors - kernel defaults are usually right):
#   net.core.somaxconn: 8192              # app listen backlog raised past the default 4096
#   net.ipv4.tcp_max_syn_backlog: 8192    # heavy incoming peer churn (ListenDrops)
#   net.ipv4.tcp_fin_timeout: 30          # many short peer conns; free half-closed sockets sooner
#   net.ipv4.tcp_slow_start_after_idle: 0 # long-idle peer conns resume at full speed
#   net.ipv4.ip_local_port_range: "1024 65535"  # outbound peer conns fail with EADDRNOTAVAIL
#   net.ipv4.tcp_congestion_control: bbr  # high-RTT path: compare with the cubic default
systemd_netns_sysctl_params: {}

# Informational reachability check after deployment: curl the exit-IP echo
# service from inside the namespace and from the host.  Never fails the run -
# comparing the two addresses is the operator's verdict.
systemd_netns_verify: false
