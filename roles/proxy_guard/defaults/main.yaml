---
# defaults file for ak1ra_lab.network.proxy_guard

# Declarative state:
#   present - apply the proxy guard table
#   absent  - remove the table file this role created (tasks/reset.yaml)
proxy_guard_state: present
proxy_guard_state_available: [present, absent]

# Master switch - disabled by default.  Review all parameters below before enabling.
proxy_guard_enabled: false
