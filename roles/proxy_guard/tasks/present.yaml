---
# tasks/present.yaml - apply the proxy guard table (proxy_guard_state:
# present) while proxy_guard_enabled is the master switch: the disabled path
# only removes a drop-in left behind by a previous run.

- name: ensure nftables package is installed
  when: proxy_guard_enabled | ansible.builtin.bool
  ansible.builtin.package:
    name: nftables
    state: present

- name: ensure /etc/nftables.d directory exists
  when: proxy_guard_enabled | ansible.builtin.bool
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: template proxy guard nft rules on remote
  when: proxy_guard_enabled | ansible.builtin.bool
  ansible.builtin.template:
    src: etc/nftables.d/ansible_proxy_guard.nft.j2
    dest: /etc/nftables.d/ansible_proxy_guard.nft
    mode: "0644"
  notify:
    - systemctl restart nftables.service

- name: remove proxy guard nft ruleset file when the master switch is off
  when: not (proxy_guard_enabled | ansible.builtin.bool)
  ansible.builtin.file:
    path: /etc/nftables.d/ansible_proxy_guard.nft
    state: absent
  notify:
    - systemctl restart nftables.service

- name: ensure nftables.service enabled
  when: proxy_guard_enabled | ansible.builtin.bool
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true
