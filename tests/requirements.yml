# are resolved by ansible-compat/ade.
collections:
  - name: ansible.utils
    version: ">=6.0.0"
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
  - name: containers.podman
  - name: community.docker
