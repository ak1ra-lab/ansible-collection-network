---
# Collections installed by tox-ansible/ade for the Molecule scenarios.
# The collection under test is installed editable by tox-ansible itself.
# ak1ra_lab.general is declared in galaxy.yml and is intentionally not
# repeated here: it is not on Galaxy yet, so ADE cannot resolve it until the
# first general 0.4.0 release.  Molecule's prerun resolver uses the temporary
# project-local checkout bridge described in CONTRIBUTING.md.
collections:
  - name: ansible.utils
    version: ">=6.0.0"
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
  - name: containers.podman
  - name: community.docker
