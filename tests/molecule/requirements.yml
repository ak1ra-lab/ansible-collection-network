---
# Collections installed by tox-ansible/ade for the Molecule scenarios.
# The collection under test is installed editable by tox-ansible itself, and
# ansible-compat's prerun resolves its galaxy.yml dependencies, including
# ak1ra_lab.general, from Galaxy.
collections:
  - name: ansible.utils
    version: ">=6.0.0"
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=8.0.0"
  - name: containers.podman
  - name: community.docker
