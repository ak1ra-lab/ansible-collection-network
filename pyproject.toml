[project]
name = "ansible-collection-network"
version = "0.1.0"
description = "Development tooling for the ak1ra_lab.network Ansible collection"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

# The unit tests import the filter plugins as top-level modules (the same
# sys.path entry tests/unit/conftest.py adds at runtime).
[tool.ty.environment]
extra-paths = ["plugins/filter"]

[dependency-groups]
# Shared Ansible runtime: ansible-galaxy reads the galaxy.yml manifest through
# distlib when installing the collection from source.
ansible = [
    "ansible-core>=2.19.12",
    "distlib>=0.4.4",
]
lint = [
    { include-group = "ansible" },
    "ansible-lint>=26.8.0",
    "ruff>=0.17.0",
    "ty>=0.0.40",
]
test = [
    { include-group = "ansible" },
    "pytest>=9.1.1",
]
docs = [
    { include-group = "ansible" },
    "mkdocs>=1.6,<2",
    "mkdocs-ansible-collection>=1.1.0",
    "mkdocs-material>=9.7.7,<10",
    "pymdown-extensions>=12.3,<13",
]
molecule = [
    { include-group = "ansible" },
    "molecule>=26.8.0",
    # ansible.utils.ipaddr is used by the roles' address validation.
    "netaddr>=1.3.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "molecule" },
]
