---
# See https://docs.ansible.com/ansible/latest/dev_guide/collections_galaxy_meta.html

namespace: ak1ra_lab
name: network
version: 0.4.0
readme: README.md
authors:
  - ak1ra <git@ak1ra.xyz>
description: Shared Ansible roles for network infrastructure (transparent proxy, routing).
license:
  - GPL-3.0-or-later
tags:
  - automation
  - linux
  - network
  - nftables
  - tproxy
dependencies:
  ak1ra_lab.general: ">=0.4.0"
  ansible.posix: ">=1.5.4"
  community.general: ">=8.0.0"
  ansible.utils: ">=6.0.0"
repository: https://github.com/ak1ra-lab/ansible-collection-network
documentation: https://ak1ra-lab.github.io/ansible-collection-network/
homepage: https://github.com/ak1ra-lab/ansible-collection-network
issues: https://github.com/ak1ra-lab/ansible-collection-network/issues

# Keep local development state and generated artifacts out of the Galaxy
# artifact. `ansible-galaxy collection build` always excludes galaxy.yml, .git
# and Python cache files.
build_ignore:
  - .agents
  - .ansible
  - .ansible-lint
  - .cache
  - .github
  - .gitignore
  - .molecule
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .tox
  - .venv
  - ansible.cfg
  - collections
  - config
  - importer_result.json
  - justfile
  - pyproject.toml
  - ruff.toml
  - site
  - docs/docsite/_build
  - tests/output
  - uv.lock
  - yamlfmt.yml
  - "*.tar.gz"
