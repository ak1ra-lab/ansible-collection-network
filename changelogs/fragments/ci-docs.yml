---
minor_changes:
  - Migrated the documentation site to Sphinx and antsibull-docs. Role
    reference pages are generated from ``meta/argument_specs.yml`` and filter
    reference pages from the plugin documentation, replacing MkDocs.
  - Migrated release notes to antsibull-changelog. ``CHANGELOG.rst`` is now the
    canonical changelog, generated from ``changelogs/fragments/``; the
    pre-Galaxy 0.1.0-0.3.0 history is kept in ``CHANGELOG-LEGACY.md``.
  - CI installs ansible-lint, antsibull-changelog and Molecule from the uv
    dependency groups and runs every Python tool through ``uv run``, matching
    the local just recipes. The Docs workflow grants Pages write access only to
    the deploy job.
bugfixes:
  - The Docs workflow installs ``distlib`` through the docs dependency group,
    so ``ansible-galaxy`` can read the ``galaxy.yml`` manifest when installing
    the collection from source. The ``just`` collection recipes use the uv
    environment for the same reason.
  - CI action pins were refreshed to ``actions/setup-python`` 7.1.0,
    ``astral-sh/setup-uv`` 10.3.1 and ``actions/upload-pages-artifact`` 5.0.0.
