---
minor_changes:
  - Added the tox-ansible matrix for ansible-core 2.19/2.20/2.21 and the
    weekly devel/milestone environments, plus mypy alongside ruff and
    ansible-lint.
  - Flattened the Molecule scenarios, limited each role to its supported
    Debian/Ubuntu images, and gave each scenario its own containers instead of
    a shared lifecycle or ``MOLECULE_GLOB``.
bugfixes:
  - Molecule filters the container's loopback resolver stub and reads the
    systemd-resolved uplink view before configuring the test resolver, so the
    resolver scenarios no longer break package downloads in later scenarios.
    The ``tproxy`` prepare also retries a transient package-download failure.
