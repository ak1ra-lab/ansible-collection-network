---
# Collections required to run the Molecule scenarios and to lint the
# collection's roles:
#   containers.podman - create/destroy playbooks and the podman connection
#                       used by the shared Molecule inventory (default;
#                       MOLECULE_CONTAINER_RUNTIME=podman)
#   community.docker  - create/destroy playbooks and the docker connection
#                       used when MOLECULE_CONTAINER_RUNTIME=docker
#   ansible.utils     - ipaddr/in_network filters used by the systemd_*
#                       roles (also a galaxy.yml dependency)
#   ansible.posix     - sysctl used by the tproxy and mihomo_client roles,
#                       and the profile_tasks callback enabled by ansible.cfg
#   community.general - modprobe used by the tproxy role
#
# ak1ra_lab.general (github_releases_info / cpu_info, used by the mihomo_*
# roles, and the certbot role used by the mihomo_server_certbot scenario) is
# not on Galaxy yet and is installed separately from git; the justfile dev
# recipes use the local GENERAL_COLLECTION checkout instead (see README.md).
collections:
  - name: containers.podman
  - name: community.docker
  - name: ansible.utils
  - name: ansible.posix
  - name: community.general
