---
# mihomo_server scenario - assert the converged state: the service is up,
# every configured protocol listens, the generated listeners carry the
# per-protocol user shape and the flat TLS fields, and the controller-local
# artifacts (credentials + clash-format client nodes) are correct.

- name: verify the converged mihomo server state
  hosts: all
  gather_facts: false
  tasks:
    - name: collect the mihomo service activity state
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, is-active, mihomo.service]
      changed_when: false
      register: _mihomo_server_active

    - name: assert the mihomo service is active
      ansible.builtin.assert:
        that:
          - _mihomo_server_active.stdout == 'active'
        fail_msg: "mihomo.service must be active, got: {{ _mihomo_server_active.stdout }}"
        quiet: true

    - name: collect the deployed TLS material
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/mihomo/tls/fullchain.pem
        - /etc/mihomo/tls/privkey.pem
        - /tmp/molecule-mihomo-server-hook/mihomo-server.sh
      register: _mihomo_server_tls_files
      loop_control:
        label: "{{ item }}"

    - name: assert the TLS material is copied with service-readable permissions
      ansible.builtin.assert:
        that:
          - _mihomo_server_tls_files.results[0].stat.exists
          - _mihomo_server_tls_files.results[0].stat.isreg
          - _mihomo_server_tls_files.results[0].stat.mode == '0640'
          - _mihomo_server_tls_files.results[0].stat.pw_name == 'root'
          - _mihomo_server_tls_files.results[0].stat.gr_name == 'mihomo'
          - _mihomo_server_tls_files.results[1].stat.exists
          - _mihomo_server_tls_files.results[1].stat.isreg
          - _mihomo_server_tls_files.results[1].stat.mode == '0640'
          - _mihomo_server_tls_files.results[1].stat.pw_name == 'root'
          - _mihomo_server_tls_files.results[1].stat.gr_name == 'mihomo'
          - _mihomo_server_tls_files.results[2].stat.exists
          - _mihomo_server_tls_files.results[2].stat.isreg
          - _mihomo_server_tls_files.results[2].stat.mode == '0755'
        fail_msg: >-
          the role must copy the source certificate/key to /etc/mihomo/tls
          (0640 root:mihomo) and install the renewal hook (0755), got:
          {{ _mihomo_server_tls_files.results | map(attribute='stat') | list }}
        quiet: true

    - name: read the certbot renewal hook
      ansible.builtin.slurp:
        src: /tmp/molecule-mihomo-server-hook/mihomo-server.sh
      register: _mihomo_server_hook

    - name: assert the renewal hook copies the source pair and reloads mihomo
      ansible.builtin.assert:
        that:
          - >-
            '/etc/mihomo/tls/fullchain.pem'
            in (_mihomo_server_hook.content | ansible.builtin.b64decode)
          - >-
            '/tmp/molecule-mihomo-server-source/privkey.pem'
            in (_mihomo_server_hook.content | ansible.builtin.b64decode)
          - >-
            'systemctl try-reload-or-restart mihomo.service'
            in (_mihomo_server_hook.content | ansible.builtin.b64decode)
        fail_msg: >-
          the renewal hook must re-copy the source pair and reload mihomo,
          got: {{ _mihomo_server_hook.content | ansible.builtin.b64decode }}
        quiet: true

    - name: collect the listening TCP ports
      ansible.builtin.command:
        argv: [/usr/bin/ss, -H, -ltn]
      changed_when: false
      register: _mihomo_server_tcp

    - name: collect the listening UDP ports
      ansible.builtin.command:
        argv: [/usr/bin/ss, -H, -lun]
      changed_when: false
      register: _mihomo_server_udp

    - name: assert every enabled listener is bound
      ansible.builtin.assert:
        that:
          - _mihomo_server_tcp.stdout is ansible.builtin.search(':9442')
          - _mihomo_server_tcp.stdout is ansible.builtin.search(':9443')
          - _mihomo_server_udp.stdout is ansible.builtin.search(':9444')
          - _mihomo_server_tcp.stdout is ansible.builtin.search(':9445')
          - _mihomo_server_tcp.stdout is ansible.builtin.search(':9447')
        fail_msg: >-
          the enabled listeners must be bound (ss 9442/trojan 9443/hy2 9444/
          vless 9445/anytls 9447), got TCP: {{ _mihomo_server_tcp.stdout }}
          UDP: {{ _mihomo_server_udp.stdout }}
        quiet: true

    - name: read the generated server configuration
      ansible.builtin.slurp:
        src: /etc/mihomo/config.yaml
      register: _mihomo_server_config

    - name: parse the generated server configuration
      ansible.builtin.set_fact:
        _mihomo_server_config_data: >-
          {{ _mihomo_server_config.content | ansible.builtin.b64decode | ansible.builtin.from_yaml }}

    - name: assert the generated listeners match the mihomo schema
      ansible.builtin.assert:
        that:
          - >-
            _mihomo_server_config_data['listeners'] | map(attribute='name') | list
            == ['ss-in', 'trojan-in', 'hysteria2-in', 'vless-in', 'anytls-in']
          - _mihomo_server_config_data['rules'] == ['MATCH,DIRECT']
          - "'users' not in _mihomo_server_config_data['listeners'][0]"
          - _mihomo_server_config_data['listeners'][0]['cipher'] == '2022-blake3-aes-128-gcm'
          - _mihomo_server_config_data['listeners'][1]['users'] | length == 2
          - "'username' in _mihomo_server_config_data['listeners'][1]['users'][0]"
          - _mihomo_server_config_data['listeners'][2]['users'] | length == 2
          - _mihomo_server_config_data['listeners'][2]['users'] is mapping
          - _mihomo_server_config_data['listeners'][2]['certificate'] == '/etc/mihomo/tls/fullchain.pem'
          - _mihomo_server_config_data['listeners'][2]['private-key'] == '/etc/mihomo/tls/privkey.pem'
          - _mihomo_server_config_data['listeners'][3]['users'] | length == 2
          - _mihomo_server_config_data['listeners'][3]['users'][0]['flow'] == 'xtls-rprx-vision'
          - "'certificate' not in _mihomo_server_config_data['listeners'][3]"
          - _mihomo_server_config_data['listeners'][3]['reality-config']['dest'] == 'www.microsoft.com:443'
          - _mihomo_server_config_data['listeners'][3]['reality-config']['short-id'] | length == 1
          - _mihomo_server_config_data['listeners'][3]['reality-config']['server-names'] == ['www.microsoft.com']
          - _mihomo_server_config_data['listeners'][4]['users'] | length == 2
          - _mihomo_server_config_data['listeners'][4]['users'] is mapping
        fail_msg: >-
          the generated listeners must follow the per-protocol mihomo shape
          (including vless REALITY), got:
          {{ _mihomo_server_config_data['listeners'] | ansible.builtin.to_json }}
        quiet: true

    - name: read the generated client nodes on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.slurp:
        src: >-
          /tmp/molecule-mihomo-server/artifacts/{{ inventory_hostname }}.proxies.yaml
      register: _mihomo_server_proxies

    - name: parse the generated client nodes
      ansible.builtin.set_fact:
        _mihomo_server_proxies_data: >-
          {{ _mihomo_server_proxies.content | ansible.builtin.b64decode | ansible.builtin.from_yaml }}

    - name: assert the client nodes follow the naming contract
      ansible.builtin.assert:
        that:
          - >-
            _mihomo_server_proxies_data['proxies'] | map(attribute='name') | list
            == ['selfhost-US-molecule-node01-ss',
                'selfhost-US-molecule-node01-alice-trojan',
                'selfhost-US-molecule-node01-bob-trojan',
                'selfhost-US-molecule-node01-alice-hy2',
                'selfhost-US-molecule-node01-bob-hy2',
                'selfhost-US-molecule-node01-alice-vless',
                'selfhost-US-molecule-node01-bob-vless',
                'selfhost-US-molecule-node01-alice-anytls',
                'selfhost-US-molecule-node01-bob-anytls']
        fail_msg: >-
          the generated client nodes must be named
          <prefix>-<REGION>-<host>[-<user>]-<proto>, got:
          {{ _mihomo_server_proxies_data['proxies'] | map(attribute='name') | list }}
        quiet: true

    - name: assert the anytls node carries the client fingerprint and idle-session knobs
      ansible.builtin.assert:
        that:
          - _mihomo_server_proxies_data['proxies'][7]['type'] == 'anytls'
          - _mihomo_server_proxies_data['proxies'][7]['client-fingerprint'] == 'chrome'
          - _mihomo_server_proxies_data['proxies'][7]['idle-session-check-interval'] == 30
          - _mihomo_server_proxies_data['proxies'][7]['idle-session-timeout'] == 30
          - _mihomo_server_proxies_data['proxies'][7]['min-idle-session'] == 0
        fail_msg: >-
          the generated anytls node must carry client-fingerprint and the
          idle-session knobs, got:
          {{ _mihomo_server_proxies_data['proxies'][7] | ansible.builtin.to_json }}
        quiet: true

    - name: collect the generated credentials artifact on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.slurp:
        src: >-
          {{ playbook_dir }}/host_vars/{{ inventory_hostname }}/mihomo_server.yaml
      register: _mihomo_server_host_vars

    - name: parse the generated credentials artifact
      ansible.builtin.set_fact:
        _mihomo_server_host_vars_data: >-
          {{ _mihomo_server_host_vars.content | ansible.builtin.b64decode | ansible.builtin.from_yaml }}

    - name: assert the credentials artifact carries the generated secrets
      ansible.builtin.assert:
        that:
          - _mihomo_server_host_vars_data['mihomo_server_shadowsocks_password'] | length > 0
          - _mihomo_server_host_vars_data['mihomo_server_trojan_users'] | length == 2
          - _mihomo_server_host_vars_data['mihomo_server_hysteria2_users'] | length == 2
          - _mihomo_server_host_vars_data['mihomo_server_vless_users'] | length == 2
          - _mihomo_server_host_vars_data['mihomo_server_vless_reality_private_key'] | length > 0
          - _mihomo_server_host_vars_data['mihomo_server_vless_reality_public_key'] | length > 0
          - _mihomo_server_host_vars_data['mihomo_server_vless_reality_short_id'] | length == 16
          - _mihomo_server_host_vars_data['mihomo_server_anytls_users'] | length == 2
        fail_msg: >-
          the generated credentials must be persisted to host_vars, got:
          {{ _mihomo_server_host_vars_data | ansible.builtin.to_json }}
        quiet: true

    - name: assert the same credentials are reused across every artifact
      ansible.builtin.assert:
        that:
          - >-
            _mihomo_server_config_data['listeners'][0]['password']
            == _mihomo_server_host_vars_data['mihomo_server_shadowsocks_password']
          - >-
            _mihomo_server_proxies_data['proxies'][0]['password']
            == _mihomo_server_host_vars_data['mihomo_server_shadowsocks_password']
          - >-
            _mihomo_server_proxies_data['proxies'][1]['password']
            == _mihomo_server_config_data['listeners'][1]['users'][0]['password']
          - >-
            _mihomo_server_proxies_data['proxies'][3]['password']
            == _mihomo_server_config_data['listeners'][2]['users']['alice']
          - >-
            _mihomo_server_proxies_data['proxies'][5]['reality-opts']['public-key']
            == _mihomo_server_host_vars_data['mihomo_server_vless_reality_public_key']
          - >-
            _mihomo_server_proxies_data['proxies'][5]['reality-opts']['short-id']
            == _mihomo_server_host_vars_data['mihomo_server_vless_reality_short_id']
          - >-
            _mihomo_server_config_data['listeners'][3]['reality-config']['private-key']
            == _mihomo_server_host_vars_data['mihomo_server_vless_reality_private_key']
          - >-
            _mihomo_server_proxies_data['proxies'][5]['servername'] == 'www.microsoft.com'
          - >-
            _mihomo_server_proxies_data['proxies'][5]['flow'] == 'xtls-rprx-vision'
        fail_msg: >-
          the server listeners, the client nodes and the host_vars artifact
          must carry the same generated credentials (server config, client
          nodes, credentials):
          {{ _mihomo_server_config_data['listeners'] | ansible.builtin.to_json }}
          {{ _mihomo_server_proxies_data | ansible.builtin.to_json }}
          {{ _mihomo_server_host_vars_data | ansible.builtin.to_json }}
        quiet: true
