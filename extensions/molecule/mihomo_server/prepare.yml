---
# mihomo_server scenario - one-time container preparation.
#
# The shared preparation brings up udev and refreshes apt; this scenario adds
# the tooling the verify playbook needs and provisions a throwaway
# self-signed certificate in a source directory.  mihomo_server copies it into
# /etc/mihomo/tls, exercising the same path a certbot-managed pair takes.

- name: run the shared container preparation
  import_playbook: ../shared/prepare.yml

- name: prepare the mihomo server prerequisites
  hosts: all
  gather_facts: true
  tasks:
    - name: ensure the verify tooling is installed
      ansible.builtin.package:
        name:
          - iproute2
          - openssl
          - curl
        state: present

    - name: ensure the test certificate source directory exists
      ansible.builtin.file:
        path: /tmp/molecule-mihomo-server-source
        state: directory
        mode: "0755"

    - name: generate a self-signed test certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -days
          - "1"
          - -subj
          - /CN=molecule.local
          - -keyout
          - /tmp/molecule-mihomo-server-source/privkey.pem
          - -out
          - /tmp/molecule-mihomo-server-source/fullchain.pem
        creates: /tmp/molecule-mihomo-server-source/fullchain.pem

    - name: make the test certificate source readable
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /tmp/molecule-mihomo-server-source/fullchain.pem
          mode: "0644"
        - path: /tmp/molecule-mihomo-server-source/privkey.pem
          mode: "0600"
      loop_control:
        label: "{{ item.path }}"
