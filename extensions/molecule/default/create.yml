---
# default scenario - lifecycle manager for the shared test containers.
#
# With shared_state enabled, only this scenario runs create/destroy; every
# component scenario reuses these containers.  The containers are ordinary
# Ansible managed nodes: the inventory carries the connection details and
# the image, this playbook instantiates them.

- name: create the shared test containers
  hosts: localhost
  gather_facts: false
  tasks:
    - name: create containers from the inventory
      containers.podman.podman_container:
        name: "{{ hostvars[item]['ansible_host'] }}"
        hostname: "{{ item }}"
        image: "{{ hostvars[item]['container_image'] }}"
        command: "{{ hostvars[item]['container_command'] | default('/sbin/init') }}"
        systemd: "{{ hostvars[item]['container_systemd'] | default('always') }}"
        privileged: "{{ hostvars[item]['container_privileged'] | default(true) }}"
        state: started
      loop: "{{ groups['test_resources'] }}"
      loop_control:
        label: "{{ item }}"
      register: _containers

    - name: fail when a container did not start
      ansible.builtin.assert:
        that:
          - item.container.State.Running
          - item.container.State.ExitCode == 0
        fail_msg: "container {{ item.container.Name }} failed to start"
      loop: "{{ _containers.results }}"
      loop_control:
        label: "{{ item.container.Name }}"

    # There is no Ansible module for waiting on the systemd manager to
    # finish booting; the official Molecule systemd guide recommends this
    # command.  "degraded" is a healthy state inside these containers (some
    # units cannot start without a full host), so it is accepted.
    - name: wait for systemd to finish booting
      ansible.builtin.command: systemctl is-system-running --wait # noqa: command-instead-of-module
      register: _systemd_state
      changed_when: false
      failed_when: _systemd_state.stdout not in ['running', 'degraded']
      until: _systemd_state.stdout in ['running', 'degraded']
      retries: 30
      delay: 2
      delegate_to: "{{ item }}"
      loop: "{{ groups['test_resources'] }}"
      loop_control:
        label: "{{ item }}"
