---
# Shared Molecule configuration for every scenario of this collection.
#
# Scenarios are flat under extensions/molecule/<name>/ and each one owns its
# containers.  The sequence destroys stale containers from an interrupted
# run, creates the scenario's own set, prepares/converges/verifies, runs the
# role teardown, verifies the teardown, and destroys the containers again.
#
# The inventory declares every supported image, plus one group per scenario
# with only the images that scenario supports.  `--limit` (scenario group +
# localhost) keeps a scenario's plays and its create/destroy loops on that
# subset; container names in inventory/hosts.yml include the scenario name and
# a checkout hash, so scenarios and parallel checkouts cannot collide.
#
# The collection under test is installed by ansible-compat's prerun, and the
# test-only collections by the dependency action from
# tests/molecule/requirements.yml.  No project-local `.ansible/collections`
# pre-install is required for Molecule.

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/extensions/molecule/inventory/
        - --limit=${MOLECULE_SCENARIO_NAME},localhost
  cfg:
    defaults:
      host_key_checking: false
      retry_files_enabled: false
  env:
    ANSIBLE_FORCE_COLOR: "true"
  playbooks:
    # Every scenario shares the container lifecycle implementation, but the
    # inventory gives each scenario its own uniquely named containers.
    create: ../shared/create.yml
    destroy: ../shared/destroy.yml

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/tests/molecule/requirements.yml
    # There are no scenario role dependencies; point the role dependency
    # action at an empty file so it does not warn about a missing one.
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/extensions/molecule/shared/roles-requirements.yml

scenario:
  test_sequence:
    - dependency
    # Remove leftovers from a failed run before creating the scenario's own
    # containers.  The destroy play only touches localhost.
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - verify absent-verify.yml
    - destroy
