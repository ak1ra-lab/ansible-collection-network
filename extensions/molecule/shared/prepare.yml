---
# Shared preparation for every component scenario.
#
# The ak1ra-lab/docker-systemd images do not install udev, and
# systemd-networkd waits for udev to initialize a link before it configures
# it: without udev every link stays in the "pending" setup state and no
# bridge address is ever assigned.  Real managed hosts always ship udev, so
# this is a test-container prerequisite, not something the roles under test
# should provide.
#
# The images also ship an apt index from their build time; it goes stale as
# the distributions publish new package versions, and the roles' `package`
# installs then fail with 404s.  Every preparation refreshes the index first
# (the components share one container, so `cache_valid_time` keeps this to
# one refresh per test run).
#
# Installing systemd-resolved (the mihomo_client and systemd_resolved
# scenarios do) makes the distribution package replace /etc/resolv.conf with
# its 127.0.0.53 stub and, on Debian, rewrite /etc/nsswitch.conf to resolve
# through it.  In these containers networkd does not manage the runtime's
# interface, so resolved has no upstream servers and later apt downloads fail
# with "Temporary failure resolving ...".  Point resolved at the resolver the
# container runtime gave us; the role's own drop-in (90-ansible-resolved.conf)
# still overrides it while installed.
#
# The runtime resolver may itself be the 127.0.0.53 stub, so ignore loopback
# entries and prefer the real uplink view in
# /run/systemd/resolve/resolv.conf when it exists.  The fixture under /run is
# only a fallback for the point where the package has replaced
# /etc/resolv.conf and resolved has no uplink view yet.
#
# Scenario-specific prepare.yml files import this play first and then add
# their own prerequisites (test veth members, container accommodations).

- name: prepare the systemd container for systemd-networkd
  hosts: all
  gather_facts: true
  tasks:
    - name: collect the saved upstream DNS fixture
      ansible.builtin.stat:
        path: /run/molecule-upstream-dns
      register: _molecule_upstream_dns_file

    - name: check for the systemd-resolved uplink resolver file
      ansible.builtin.stat:
        path: /run/systemd/resolve/resolv.conf
      register: _molecule_uplink_resolv_conf_file

    - name: read the container runtime resolver configuration
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: _molecule_resolv_conf

    - name: read the systemd-resolved uplink resolver configuration
      when: _molecule_uplink_resolv_conf_file.stat.exists
      ansible.builtin.slurp:
        src: /run/systemd/resolve/resolv.conf
      register: _molecule_uplink_resolv_conf

    - name: collect the current container DNS servers
      ansible.builtin.set_fact:
        _molecule_current_dns_servers: >-
          {{ (((_molecule_resolv_conf.content | ansible.builtin.b64decode).splitlines())
              + ((_molecule_uplink_resolv_conf.content | default('')
                  | ansible.builtin.b64decode).splitlines()))
             | select('match', '^nameserver\s+')
             | map('regex_replace', '^nameserver\s+(\S+).*$', '\1')
             | reject('in', ['127.0.0.53', '127.0.0.1', '0.0.0.0', '::1', '::'])
             | unique
             | list }}

    - name: read the saved upstream DNS servers
      when: _molecule_upstream_dns_file.stat.exists
      ansible.builtin.slurp:
        src: /run/molecule-upstream-dns
      register: _molecule_saved_upstream_dns

    - name: choose the upstream DNS servers
      ansible.builtin.set_fact:
        _molecule_upstream_dns_servers: >-
          {{ _molecule_current_dns_servers
             if _molecule_current_dns_servers | length > 0
             else ((_molecule_saved_upstream_dns.content | default('')
                    | ansible.builtin.b64decode).split()) }}

    - name: assert the container resolver configuration is usable
      ansible.builtin.assert:
        that:
          - _molecule_upstream_dns_servers | length > 0
        fail_msg: >-
          /etc/resolv.conf and /run/systemd/resolve/resolv.conf have no
          usable nameserver entry; the test containers need a working
          resolver for package downloads
        quiet: true

    - name: persist the container upstream DNS servers
      ansible.builtin.copy:
        content: "{{ _molecule_upstream_dns_servers | join(' ') }}\n"
        dest: /run/molecule-upstream-dns
        owner: root
        group: root
        mode: "0644"

    - name: ensure the systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: keep systemd-resolved on the container upstream DNS
      ansible.builtin.copy:
        content: |
          # Generated by the Molecule harness - do not edit.
          # The role under test owns 90-ansible-resolved.conf.
          [Resolve]
          DNS={{ _molecule_upstream_dns_servers | join(' ') }}
        dest: /etc/systemd/resolved.conf.d/00-molecule-upstream.conf
        owner: root
        group: root
        mode: "0644"
      register: _molecule_resolved_upstream

    - name: collect the systemd-resolved unit state
      ansible.builtin.command:
        argv: [systemctl, show, --property=LoadState, --value, systemd-resolved.service]
      register: _molecule_resolved_load_state
      changed_when: false
      failed_when: false

    - name: collect the systemd-resolved active state
      ansible.builtin.command:
        argv: [systemctl, is-active, systemd-resolved.service]
      register: _molecule_resolved_active_state
      changed_when: false
      failed_when: false

    - name: restart systemd-resolved after changing its upstream DNS
      when:
        - _molecule_resolved_load_state.stdout | trim == 'loaded'
        - (_molecule_resolved_upstream is changed)
          or (_molecule_resolved_active_state.stdout | trim != 'active')
      ansible.builtin.systemd_service:
        name: systemd-resolved.service
        state: restarted

    - name: collect the systemd-resolved active state after the restart
      when: _molecule_resolved_load_state.stdout | trim == 'loaded'
      ansible.builtin.command:
        argv: [systemctl, is-active, systemd-resolved.service]
      register: _molecule_resolved_active_state_after
      changed_when: false
      failed_when: false

    - name: assert systemd-resolved is active when installed
      when: _molecule_resolved_load_state.stdout | trim == 'loaded'
      ansible.builtin.assert:
        that:
          - _molecule_resolved_active_state_after.stdout | trim == 'active'
        fail_msg: >-
          systemd-resolved is installed but not active; package downloads
          through NSS/resolve would fail
        quiet: true

    - name: refresh the apt index (the images ship one from build time)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: ensure udev is installed (systemd-networkd waits for it)
      ansible.builtin.package:
        name: udev
        state: present

    - name: ensure systemd-udevd is running
      ansible.builtin.systemd_service:
        name: systemd-udevd.service
        state: started

    - name: trigger udev add events for the links that exist since boot
      ansible.builtin.command:
        argv:
          - udevadm
          - trigger
          - --action=add
          - --subsystem-match=net
      changed_when: false

    - name: wait for the udev event queue to settle
      ansible.builtin.command:
        argv:
          - udevadm
          - settle
      changed_when: false
