---
# systemd_bridge scenario - reset the shared containers.
#
# Runs at the start of the scenario (leftovers from an interrupted run), at
# the end, and before destroy, so it must tolerate a fresh host: the role's
# absent state is idempotent and the veth removal is best-effort.  Fact
# gathering is skipped so an already-removed container stays tolerable.

- name: tear down the test bridges (systemd_bridge absent)
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    systemd_bridge_state: absent
    systemd_bridge_bridges:
      - name: br-uplink
        interface: vh-br-a
      - name: br-svc
  tasks:
    - name: tear down the declared bridges
      ansible.builtin.include_role:
        name: ak1ra_lab.network.systemd_bridge

    - name: remove the test veth pair
      ansible.builtin.command:
        argv: [/usr/bin/ip, link, del, vh-br-a]
      changed_when: false
      failed_when: false
