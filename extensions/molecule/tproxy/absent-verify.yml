---
# tproxy scenario - assert the teardown the cleanup action performed: the
# role-managed artifacts are gone, while the shared system files the role
# deliberately leaves alone (base nftables config, nftables.service) remain.

- name: verify the tproxy teardown
  hosts: all
  gather_facts: false
  tasks:
    - name: collect the remaining nftables tables
      ansible.builtin.command:
        argv: [/usr/sbin/nft, list, tables]
      changed_when: false
      register: _tproxy_tables

    - name: assert the tproxy table is gone
      ansible.builtin.assert:
        that:
          - _tproxy_tables.stdout is not search('ansible_tproxy')
        fail_msg: "the tproxy table must be gone, got: {{ _tproxy_tables.stdout }}"
        quiet: true

    - name: collect the remaining IPv4 policy routing rules
      ansible.builtin.command:
        argv: [/usr/bin/ip, -4, rule, show]
      changed_when: false
      register: _tproxy_ip_rules

    - name: assert the fwmark rule is gone
      ansible.builtin.assert:
        that:
          - _tproxy_ip_rules.stdout is not search('lookup ansible_tproxy')
          - _tproxy_ip_rules.stdout is not search('lookup 224')
        fail_msg: >-
          the ansible-tproxy-routing rules must be gone, got:
          {{ _tproxy_ip_rules.stdout }}
        quiet: true

    - name: collect the tproxy route table
      ansible.builtin.command:
        argv: [/usr/bin/ip, -4, route, show, table, "224"]
      changed_when: false
      register: _tproxy_route_table

    - name: assert the local default route is gone
      ansible.builtin.assert:
        that:
          - _tproxy_route_table.stdout | trim == ''
        fail_msg: >-
          the local default route must be gone, got:
          {{ _tproxy_route_table.stdout }}
        quiet: true

    - name: collect the teardown state of the role's artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/iproute2/rt_tables.d/ansible_tproxy.conf
        - /etc/nftables.d/ansible_tproxy.nft
        - /etc/systemd/system/ansible-tproxy-routing.service
        - /etc/sysctl.d/90-ansible-tproxy-ip_forward.conf
        - /etc/sysctl.d/90-ansible-tproxy-nf_conntrack.conf
        - /etc/sysctl.d/90-ansible-tproxy-tcp_bbr.conf
        - /etc/modules-load.d/nft_tproxy.conf
        - /etc/modules-load.d/nft_socket.conf
        - /etc/modules-load.d/nf_tproxy_ipv4.conf
        - /etc/modules-load.d/nf_tproxy_ipv6.conf
        - /etc/modules-load.d/tcp_bbr.conf
      register: _tproxy_artifacts_after
      loop_control:
        label: "{{ item }}"

    - name: assert no role artifact is left behind
      ansible.builtin.assert:
        that:
          - >-
            _tproxy_artifacts_after.results | selectattr('stat.exists') | list | length
            == 0
        fail_msg: >-
          leftover tproxy artifacts:
          {{ _tproxy_artifacts_after.results | selectattr('stat.exists') | map(attribute='item') | list }}
        quiet: true

    - name: collect the shared system files the role leaves in place
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/nftables.conf
        - /etc/systemd/system/nftables.service
      register: _tproxy_shared_after
      loop_control:
        label: "{{ item }}"

    - name: assert the deliberately untouched shared files remain
      ansible.builtin.assert:
        that:
          - >-
            _tproxy_shared_after.results | selectattr('stat.exists') | list | length
            == _tproxy_shared_after.results | length
        fail_msg: >-
          shared files removed by the tproxy teardown:
          {{ _tproxy_shared_after.results | rejectattr('stat.exists') | map(attribute='item') | list }}
        quiet: true
