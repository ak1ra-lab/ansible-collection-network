---
# flow_offload scenario - assert the teardown the cleanup action performed:
# the role's drop-in and the loaded table are gone.

- name: verify the flow_offload teardown
  hosts: all
  gather_facts: false
  tasks:
    - name: collect the teardown state of the role's drop-in
      ansible.builtin.stat:
        path: /etc/nftables.d/ansible_flow_offload.nft
      register: _flow_offload_dropin_after

    - name: assert the drop-in is gone
      ansible.builtin.assert:
        that:
          - not _flow_offload_dropin_after.stat.exists
        fail_msg: "the flow offload drop-in must be gone"
        quiet: true

    - name: collect the remaining nftables tables
      ansible.builtin.command:
        argv: [/usr/sbin/nft, list, tables]
      changed_when: false
      register: _flow_offload_tables

    - name: assert the flow offload table is gone
      ansible.builtin.assert:
        that:
          - _flow_offload_tables.stdout is not ansible.builtin.search('ansible_flow_offload')
        fail_msg: >-
          the flow offload table must be gone, got:
          {{ _flow_offload_tables.stdout }}
        quiet: true
