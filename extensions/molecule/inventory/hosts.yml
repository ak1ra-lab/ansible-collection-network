---
# Shared managed nodes for every Molecule scenario.
#
# One host per systemd-enabled container image from ak1ra-lab/docker-systemd
# that this collection's roles support.  The roles target the Debian and
# Ubuntu families (their meta/main.yml declares trixie/bookworm and
# noble/jammy; ubuntu-26.04 (resolute) is tested ahead of that declaration),
# and the images provide the systemd and nftables facilities the roles need.
#
# ansible_host is the container name the containers.podman connection plugin
# attaches to; it is prefixed so parallel checkouts and CI jobs on one host
# do not collide.  The values are spelled out (not templated from
# inventory_hostname) because delegated connection variables are resolved in
# the delegating host's context, where that template would see "localhost".

all:
  children:
    test_resources:
      hosts:
        debian-12:
          ansible_host: molecule-ak1ra-network-debian-12
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:12
        debian-13:
          ansible_host: molecule-ak1ra-network-debian-13
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
        ubuntu-2404:
          ansible_host: molecule-ak1ra-network-ubuntu-2404
          container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:24.04
        ubuntu-2604:
          ansible_host: molecule-ak1ra-network-ubuntu-2604
          container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:26.04
