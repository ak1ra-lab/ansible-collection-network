---
# Supported managed nodes for every Molecule scenario.
#
# The systemd roles require systemd-networkd, which ships with Debian and
# Ubuntu (and with the Fedora `systemd-networkd` package) but is not available
# on the RHEL family, and the tproxy family needs the nftables kernel
# facilities.  Role metadata declares Debian 12/13 and Ubuntu 22.04/24.04;
# Ubuntu 26.04 is not declared, so it is not part of the test matrix.
#
# test_resources holds every image.  The groups below select the images each
# scenario actually needs; config.yml uses `--limit=<scenario>,localhost` and
# create/destroy loop over the same group, so no role runs on every image.
#
# ansible_host must be a literal template that does not depend on
# inventory_hostname: delegated connection variables are resolved in the
# delegating host's context (localhost).  The scenario name and a stable hash
# of the checkout keep container names isolated across scenarios and parallel
# checkouts.
#
# Images are tracked by tag.  Pin them by digest in the consumer repository if
# reproducible image pulls are required.

all:
  children:
    test_resources:
      hosts:
        debian-12:
          ansible_host: >-
            molecule-network-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-12
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:12
        debian-13:
          ansible_host: >-
            molecule-network-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-debian-13
          container_image: ghcr.io/ak1ra-lab/docker-systemd/debian:13
        ubuntu-2404:
          ansible_host: >-
            molecule-network-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}-{{ (lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | to_uuid)[:8] }}-ubuntu-2404
          container_image: ghcr.io/ak1ra-lab/docker-systemd/ubuntu:24.04

    cloud_init:
      hosts:
        debian-12:
        debian-13:

    netplan_static:
      hosts:
        debian-12:
        debian-13:

    systemd_bridge:
      hosts:
        debian-12:
        ubuntu-2404:

    systemd_netns:
      hosts:
        debian-12:
        ubuntu-2404:

    systemd_resolved:
      hosts:
        debian-12:
        ubuntu-2404:

    tproxy:
      hosts:
        debian-12:
        debian-13:

    flow_offload:
      hosts:
        debian-12:
        debian-13:

    proxy_guard:
      hosts:
        debian-12:
        debian-13:

    mihomo_client:
      hosts:
        debian-12:
        debian-13:

    mihomo_server:
      hosts:
        debian-12:
        debian-13:

    mihomo_server_jls:
      hosts:
        debian-12:
        debian-13:
