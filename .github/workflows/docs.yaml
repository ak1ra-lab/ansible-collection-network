---
# Build the Sphinx site and publish it to GitHub Pages.
#
# The docs plugin reads the collection through ansible-doc, so the workflow
# installs the collection under test into the project-local collections path
# before building. Role READMEs are included through Markdown snippets, which
# is why changes under roles/**/README.md trigger a rebuild.
name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "plugins/**"
      - "roles/**/README.md"
      - "roles/**/meta/argument_specs.yml"
      - "CONTRIBUTING.md"
      - "CHANGELOG.rst"
      - "CHANGELOG-LEGACY.md"
      - "CODE_OF_CONDUCT.md"
      - "README.md"
      - "docs/docsite/**"
      - "pyproject.toml"
      - "uv.lock"
      - "galaxy.yml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Install docs dependencies
        run: uv sync --locked --no-dev --group docs
      - name: Install the collection and its dependencies
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
      - name: Lint collection documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: >-
          uv run --no-sync antsibull-docs lint-collection-docs
          --plugin-docs --validate-collection-refs self .
      - name: Build the Sphinx documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: uv run --no-sync bash docs/docsite/build.sh
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/docsite/_build/html

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
