---
# Collection CI: lint/typecheck/docs, the tox-ansible sanity and unit matrix,
# the Galaxy build-import gate, and the Molecule scenarios.
#
# Python tooling comes from the uv-managed environment. The Molecule job stays
# separate and does not use the full Python x ansible-core matrix. It runs
# rootful Podman because systemd_netns and tproxy need host kernel facilities
# that rootless containers cannot provide.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Weekly devel/milestone coverage (Monday 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the lint and docs dependencies
        run: uv sync --locked --no-dev --group lint --group docs
      - name: Install the collection and test dependencies
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r tests/requirements.yml --collections-path .ansible/collections
      - name: Run ansible-lint
        env:
          ANSIBLE_HOME: ${{ github.workspace }}/.ansible
        run: uv run --no-sync ansible-lint
      - name: Run ruff and mypy
        run: |
          uv run --no-sync ruff check plugins/ tests/
          uv run --no-sync ruff format --check plugins/ tests/
          uv run --no-sync mypy plugins/ tests/
      - name: Lint the changelog fragments
        run: uv run --no-sync antsibull-changelog lint
      - name: Lint collection documentation
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: >-
          uv run --no-sync antsibull-docs lint-collection-docs
          --plugin-docs --validate-collection-refs self .
      - name: Build the Sphinx documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: uv run --no-sync bash docs/docsite/build.sh

  build-import:
    name: Build and import
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the lint dependencies
        run: uv sync --locked --no-dev --group lint
      - name: Build the collection
        id: build
        run: |
          rm -rf dist
          uv run --no-sync ansible-galaxy collection build --output-path dist
          shopt -s nullglob
          tarballs=(dist/*.tar.gz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "expected exactly one collection artifact in dist/, found ${#tarballs[@]}" >&2
            exit 1
          fi
          printf 'tarball=%s\n' "${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Run galaxy-importer on the built artifact
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          uv run --no-sync python -m galaxy_importer.main \
            "$TARBALL" \
            --print-result
      - name: Smoke-test a clean install
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          tmp=$(mktemp -d)
          uv run --no-sync ansible-galaxy collection install --force --no-deps \
            "$TARBALL" -p "$tmp/collections"
          ANSIBLE_COLLECTIONS_PATH="$tmp/collections" \
            uv run --no-sync ansible-doc -t filter ak1ra_lab.network.pretty_yaml >/dev/null

  sanity:
    name: Sanity py${{ matrix.python }}-${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            ansible: "2.19"
          - python: "3.12"
            ansible: "2.20"
          - python: "3.13"
            ansible: "2.21"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run ansible-test sanity through tox-ansible
        run: >-
          uv run --no-sync tox
          -e sanity-py${{ matrix.python }}-${{ matrix.ansible }}
          --ansible

  unit:
    name: Unit py${{ matrix.python }}-${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            ansible: "2.19"
          - python: "3.12"
            ansible: "2.20"
          - python: "3.13"
            ansible: "2.21"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run ansible-test units through tox-ansible
        run: >-
          uv run --no-sync tox
          -e unit-py${{ matrix.python }}-${{ matrix.ansible }}
          --ansible

  devel:
    name: ${{ matrix.test }} py3.13-${{ matrix.ansible }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [sanity, unit]
        ansible: [devel, milestone]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run the weekly devel/milestone environment
        run: >-
          uv run --no-sync tox
          -e ${{ matrix.test }}-py3.13-${{ matrix.ansible }}
          --ansible

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the Molecule dependencies
        run: uv sync --locked --no-dev --group molecule
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Run the Molecule scenarios
        env:
          # Authenticate the mihomo_install/mihomo_client GitHub release
          # lookups; unauthenticated api.github.com calls from shared runner
          # IPs hit the 60-request hourly rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          sudo env "PATH=${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          "ANSIBLE_HOME=${GITHUB_WORKSPACE}/.ansible"
          "GITHUB_TOKEN=${GITHUB_TOKEN}"
          molecule test --all
