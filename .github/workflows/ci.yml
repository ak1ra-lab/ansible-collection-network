---
# Collection CI: ansible-lint, the plugin unit tests and the Molecule
# scenarios.
#
# The Molecule scenarios run with rootful Podman on the runner (the same
# recipe as ak1ra-lab/docker-systemd): the systemd_netns role's unit calls
# `ip netns exec`, which performs a recursive /sys bind mount that rootless
# Podman cannot do inside a user namespace, and the tproxy scenario loads
# host kernel modules (`modprobe nft_tproxy`, `tcp_bbr`, ...), which a
# rootless runtime cannot do inside a user namespace.  Rootful Podman also
# supports the privileged containers every scenario uses.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ansible-lint and the required collections
        run: |
          python -m pip install --upgrade pip
          # distlib is required by ansible-galaxy to process the collection
          # manifest in galaxy.yml when installing from source.
          pip install "ansible-lint==26.8.0" distlib
          # The repository's ansible.cfg points collections_path at
          # ./.ansible/collections; install the collection under test (for
          # the ak1ra_lab.network.* references in playbooks) and the
          # scenario requirements there.
          mkdir -p .ansible/collections
          ansible-galaxy collection install --force --collections-path .ansible/collections .
          ansible-galaxy collection install -r requirements.yaml -p .ansible/collections
          # The mihomo_* roles also need ak1ra_lab.general
          # (github_releases_info / cpu_info); it is not on Galaxy yet, so
          # install it from git.
          ansible-galaxy collection install "git+https://github.com/ak1ra-lab/ansible-collection-general.git,master" -p .ansible/collections
      - name: Run ansible-lint
        run: ansible-lint
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Run ruff and ty
        run: |
          uv sync --group lint
          uv run ruff check plugins/ tests/
          uv run ruff format --check plugins/ tests/
          uv run ty check plugins/ tests/
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --group docs mkdocs build --strict

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Run the filter and lookup plugin unit tests
        run: |
          uv sync --group test
          uv run pytest tests/unit -q

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          # distlib is required by ansible-galaxy to process the collection
          # manifest in galaxy.yml when installing from source (prerun);
          # netaddr is required by the ansible.utils.ipaddr filters used by
          # the roles.
          pip install "molecule==26.8.0" distlib netaddr
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      # The scenarios search the project-local collections path
      # (ANSIBLE_COLLECTIONS_PATH in extensions/molecule/config.yml), and
      # the shared default scenario's create/destroy run before
      # ansible-compat's prerun installs anything. Install the collection
      # under test and the scenario requirements for root up front.
      - name: Install the collection under test and scenario requirements
        run: |
          mkdir -p .ansible/collections
          sudo env "PATH=${PATH}" ansible-galaxy collection install --force --collections-path .ansible/collections .
          sudo env "PATH=${PATH}" ansible-galaxy collection install -r requirements.yaml -p .ansible/collections
          # ak1ra_lab.general (needed by the mihomo_* scenarios) is not on
          # Galaxy yet; install it from git.
          sudo env "PATH=${PATH}" ansible-galaxy collection install \
            "git+https://github.com/ak1ra-lab/ansible-collection-general.git,master" \
            -p .ansible/collections
      # Rootful Podman is required (see the workflow header). The preserved
      # PATH lets the root shell use the runner's pip-installed molecule.
      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
