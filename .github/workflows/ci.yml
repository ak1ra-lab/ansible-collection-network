---
# Collection CI: ansible-lint, the plugin unit tests and the Molecule
# scenarios.
#
# All Python tooling comes from the uv-managed environment.  Each job syncs
# the dependency groups it needs once and then runs the tools through
# `uv run --no-sync`; do not add pip installs here, declare the tool in
# `pyproject.toml` instead.
#
# The Molecule scenarios run with rootful Podman on the runner (the same
# recipe as ak1ra-lab/docker-systemd): the systemd_netns role's unit calls
# `ip netns exec`, which performs a recursive /sys bind mount that rootless
# Podman cannot do inside a user namespace, and the tproxy scenario loads
# host kernel modules (`modprobe nft_tproxy`, `tcp_bbr`, ...), which a
# rootless runtime cannot do inside a user namespace.  Rootful Podman also
# supports the privileged containers every scenario uses.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the lint and docs dependencies
        run: uv sync --locked --no-dev --group lint --group docs
      - name: Install the collection under test and the required collections
        run: |
          mkdir -p .ansible/collections
          # The repository's ansible.cfg points collections_path at
          # ./.ansible/collections; install the collection under test (for
          # the ak1ra_lab.network.* references in playbooks) and the
          # scenario requirements there.
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
          # The mihomo_* roles also need ak1ra_lab.general
          # (github_releases_info / cpu_info); it is not on Galaxy yet, so
          # install it from git.
          uv run --no-sync ansible-galaxy collection install \
            "git+https://github.com/ak1ra-lab/ansible-collection-general.git,master" \
            -p .ansible/collections
      - name: Run ansible-lint
        run: uv run --no-sync ansible-lint
      - name: Run ruff and ty
        run: |
          uv run --no-sync ruff check plugins/ tests/
          uv run --no-sync ruff format --check plugins/ tests/
          uv run --no-sync ty check plugins/ tests/
      - name: Build the documentation site
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the test dependencies
        run: uv sync --locked --no-dev --group test
      - name: Run the filter plugin and template unit tests
        run: uv run --no-sync pytest tests/unit -q

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync the Molecule dependencies
        run: uv sync --locked --no-dev --group molecule
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      # The scenarios search the project-local collections path
      # (ANSIBLE_COLLECTIONS_PATH in extensions/molecule/config.yml), and
      # the shared default scenario's create/destroy run before
      # ansible-compat's prerun installs anything. Install the collection
      # under test and the scenario requirements up front.
      - name: Install the collection under test and scenario requirements
        run: |
          mkdir -p .ansible/collections
          uv run --no-sync ansible-galaxy collection install \
            --force --collections-path .ansible/collections .
          uv run --no-sync ansible-galaxy collection install \
            -r requirements.yaml -p .ansible/collections
          # ak1ra_lab.general (needed by the mihomo_* scenarios) is not on
          # Galaxy yet; install it from git.
          uv run --no-sync ansible-galaxy collection install \
            "git+https://github.com/ak1ra-lab/ansible-collection-general.git,master" \
            -p .ansible/collections
      # Rootful Podman is required (see the workflow header). Put the
      # uv-managed virtualenv first on PATH so the root shell runs the same
      # Molecule and ansible-core binaries as the unprivileged steps.
      - name: Run the Molecule scenarios
        run: >-
          sudo env "PATH=${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          MOLECULE_GLOB='extensions/molecule/**/molecule.yml'
          molecule test --all
